<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="Cabinet art: a lunar module standing on the Moon with Earth in the black sky">
<defs>
  <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#000006"/><stop offset=".6" stop-color="#03041A"/><stop offset="1" stop-color="#060A22"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2A2933"/><stop offset=".28" stop-color="#55535F"/>
    <stop offset=".6" stop-color="#918E9A"/><stop offset=".85" stop-color="#C6C3CB"/>
    <stop offset="1" stop-color="#E8E5EA"/>
  </linearGradient>
  <radialGradient id="earthDisc" cx=".36" cy=".3" r=".88">
    <stop offset="0" stop-color="#CFF0FF"/><stop offset=".2" stop-color="#63BCF2"/>
    <stop offset=".5" stop-color="#2379D6"/><stop offset=".8" stop-color="#124A9E"/>
    <stop offset="1" stop-color="#0A2657"/>
  </radialGradient>
  <!-- crinkled gold thermal blanket -->
  <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3E2B05"/><stop offset=".14" stop-color="#A87C18"/>
    <stop offset=".3" stop-color="#FFE18C"/><stop offset=".46" stop-color="#D9A227"/>
    <stop offset=".62" stop-color="#FFEDB4"/><stop offset=".8" stop-color="#8A5F10"/>
    <stop offset="1" stop-color="#2E1E03"/>
  </linearGradient>
  <linearGradient id="hullTop" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2E3340"/><stop offset=".24" stop-color="#8B95A8"/>
    <stop offset=".5" stop-color="#E4E9F2"/><stop offset=".78" stop-color="#8992A3"/>
    <stop offset="1" stop-color="#262B36"/>
  </linearGradient>
  <filter id="kglow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ksoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="4" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>

<rect width="400" height="520" fill="url(#space)"/>

<g fill="#FFFFFF">
  <circle cx="30" cy="38" r="1.7" opacity=".9"/><circle cx="112" cy="26" r="1.2" opacity=".65"/>
  <circle cx="188" cy="52" r="1"   opacity=".5"/><circle cx="256" cy="24" r="1.5" opacity=".8"/>
  <circle cx="366" cy="66" r="1.2" opacity=".6"/><circle cx="60"  cy="104" r="1"  opacity=".45"/>
  <circle cx="330" cy="128" r="1.1" opacity=".5"/><circle cx="16" cy="188" r="1"  opacity=".4"/>
</g>

<!-- Earth -->
<g transform="translate(312 96)">
  <circle r="74" fill="#4FC3FF" opacity=".13" filter="url(#ksoft)"/>
  <circle r="46" fill="url(#earthDisc)"/>
  <g clip-path="circle(46px at 0 0)">
    <!-- Africa: the horn, the bulge, the taper to the Cape -->
    <path d="M-8 -14 q9 -5 17 -2 q6 3 5 9 l7 3 q3 5 -2 8 l-6 2 q-1 8 -7 14
             q-5 5 -9 12 q-3 6 -7 3 q-3 -3 -1 -9 q-5 -7 -6 -16 q-1 -9 -3 -14
             q-2 -6 4 -7 q4 -1 8 -3Z" fill="#3E9E58" opacity=".95"/>
    <!-- Arabia -->
    <path d="M12 -17 q7 -2 10 3 q2 4 -3 6 q-6 2 -9 -2 q-2 -4 2 -7Z" fill="#C8A24E" opacity=".85"/>
    <!-- Europe, a broken northern edge -->
    <path d="M-14 -30 q11 -4 20 -1 q4 2 1 5 q-6 3 -12 2 q-7 -1 -9 -6Z" fill="#3E9E58" opacity=".85"/>
    <!-- Madagascar -->
    <path d="M17 8 q4 3 2 8 q-2 4 -5 1 q-2 -5 3 -9Z" fill="#3E9E58" opacity=".9"/>
    <!-- the Sahara, lighter than the rest -->
    <path d="M-12 -18 q14 -5 26 -1 q3 4 -2 7 q-13 4 -23 1 q-4 -3 -1 -7Z" fill="#D2AC5C" opacity=".55"/>
    <!-- South America clipped at the western limb -->
    <path d="M-44 2 q8 -5 13 1 q4 6 -1 14 q-5 9 -11 6 q-5 -3 -4 -11 q0 -6 3 -10Z" fill="#3E9E58" opacity=".8"/>
    <!-- weather -->
    <g fill="#FFFFFF" opacity=".4">
      <path d="M-44 -10 q19 -9 38 -2 q-16 11 -38 2Z"/>
      <path d="M-16 26 q24 -8 42 3 q-21 10 -42 -3Z"/>
      <path d="M-2 -38 q18 -5 32 2 q-16 8 -32 -2Z"/>
    </g>
    <!-- polar caps -->
    <path d="M-46 -34 q46 -12 92 0 l0 -14 l-92 0Z" fill="#FFFFFF" opacity=".55"/>
    <path d="M-46 34 q46 12 92 0 l0 14 l-92 0Z" fill="#FFFFFF" opacity=".5"/>
    <circle r="46" fill="#02040F" opacity=".7" transform="translate(37 0)"/>
  </g>
  <circle r="46" fill="none" stroke="#9FE2FF" stroke-width="2" opacity=".7"/>
</g>

<!-- Moon: close curved horizon, big shadowed craters -->
<g>
  <path d="M0 286 L44 268 L88 286 L134 264 L180 284 L228 264 L278 286 L326 268 L400 284 L400 312 L0 312Z" fill="#22212D"/>
  <path d="M-20 330 Q200 292 420 330 L420 520 L-20 520Z" fill="url(#ground)"/>
  <path d="M-20 330 Q200 292 420 330" fill="none" stroke="#F4F1F6" stroke-width="2.8" opacity=".75"/>
  <g>
    <ellipse cx="58" cy="392" rx="66" ry="19" fill="#121119"/>
    <path d="M-8 392 a66 19 0 0 1 132 0" fill="none" stroke="#DFDCE4" stroke-width="3" opacity=".55"/>
    <ellipse cx="340" cy="440" rx="82" ry="24" fill="#0F0E15"/>
    <path d="M258 440 a82 24 0 0 1 164 0" fill="none" stroke="#E6E3EA" stroke-width="3.2" opacity=".5"/>
    <ellipse cx="140" cy="490" rx="58" ry="17" fill="#0D0C12"/>
  </g>
</g>
<ellipse cx="300" cy="356" rx="160" ry="48" fill="#4FC3FF" opacity=".07" filter="url(#ksoft)"/>

<!-- ══ LUNAR MODULE ══ boxy descent stage, angular ascent stage, wide splayed legs ══ -->
<g transform="translate(190 300)">
  <!-- cast shadow, away from the sun -->
  <ellipse cx="-30" cy="128" rx="108" ry="15" fill="#07060C" opacity=".85"/>

  <!-- rear legs first, so the front ones overlap -->
  <g stroke="#9AA3B4" stroke-width="4" stroke-linecap="round" fill="none" opacity=".75">
    <path d="M-30 40 L-74 112"/><path d="M30 40 L74 112"/>
  </g>
  <g fill="#B9C0CD" opacity=".8">
    <ellipse cx="-74" cy="114" rx="15" ry="5"/><ellipse cx="74" cy="114" rx="15" ry="5"/>
  </g>

  <!-- descent stage: flat octagonal box, gold blanketed -->
  <path d="M-56 34 L-44 -2 L44 -2 L56 34 L44 60 L-44 60Z" fill="url(#foil)"/>
  <path d="M-44 -2 L44 -2 L40 6 L-40 6Z" fill="#FFF2C4" opacity=".65"/>
  <path d="M-56 34 L56 34" stroke="#4A3306" stroke-width="1.6" opacity=".5"/>
  <g stroke="#3E2B05" stroke-width="1.3" opacity=".45">
    <path d="M-34 -2 L-30 60"/><path d="M-12 -2 L-10 60"/><path d="M12 -2 L11 60"/><path d="M34 -2 L30 60"/>
  </g>
  <!-- descent engine bell -->
  <path d="M-13 60 L13 60 L9 80 L-9 80Z" fill="url(#hullTop)"/>
  <ellipse cx="0" cy="80" rx="9" ry="3.2" fill="#0A0D15"/>

  <!-- front legs: primary struts + down-locks + big pads -->
  <g stroke="#CBD2DF" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M-46 34 L-92 116"/><path d="M46 34 L92 116"/>
  </g>
  <g stroke="#8E96A6" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M-30 54 L-76 108"/><path d="M30 54 L76 108"/>
  </g>
  <g fill="#E2E7F0">
    <ellipse cx="-92" cy="118" rx="19" ry="6.5"/><ellipse cx="92" cy="118" rx="19" ry="6.5"/>
  </g>
  <g fill="#9AA3B4">
    <ellipse cx="-92" cy="114" rx="19" ry="5"/><ellipse cx="92" cy="114" rx="19" ry="5"/>
  </g>
  <!-- contact probes -->
  <g stroke="#CBD2DF" stroke-width="2.2" stroke-linecap="round">
    <path d="M-92 122 L-92 136"/><path d="M92 122 L92 136"/>
  </g>
  <!-- ladder on the near leg -->
  <g stroke="#D8DEE9" stroke-width="1.8">
    <path d="M-38 36 L-64 92"/><path d="M-32 40 L-58 96"/>
    <path d="M-40 48 L-36 50"/><path d="M-46 60 L-42 62"/><path d="M-52 72 L-48 74"/><path d="M-58 84 L-54 86"/>
  </g>

  <!-- ascent stage: irregular, angular crew module -->
  <path d="M-34 -2 L-38 -34 L-26 -52 L26 -52 L38 -34 L34 -2Z" fill="url(#hullTop)"/>
  <path d="M-38 -34 L-26 -52 L26 -52 L38 -34Z" fill="#F0F4FA" opacity=".35"/>
  <path d="M20 -52 L38 -34 L34 -2 L24 -2Z" fill="#0A0D14" opacity=".35"/>
  <!-- two forward-canted triangular windows, the signature of the type -->
  <g>
    <path d="M-24 -40 L-8 -44 L-10 -28 L-24 -26Z" fill="#050B1A" stroke="#D2D8E4" stroke-width="2.2"/>
    <path d="M8 -44 L24 -40 L24 -26 L10 -28Z"    fill="#050B1A" stroke="#D2D8E4" stroke-width="2.2"/>
    <path d="M-22 -38 L-12 -41" stroke="#9FE2FF" stroke-width="2" opacity=".8" stroke-linecap="round"/>
  </g>
  <!-- forward hatch -->
  <rect x="-9" y="-22" width="18" height="16" rx="2" fill="#69717F" stroke="#C2C9D6" stroke-width="1.8"/>
  <g transform="translate(0 -14) scale(.24)">
    <path d="M0 -30 L8.8 -9.3 31.5 -9.3 13.2 3.6 20.1 25.2 0 12 -20.1 25.2 -13.2 3.6 -31.5 -9.3 -8.8 -9.3Z"
          fill="#E01020" stroke="#FFD23F" stroke-width="3"/>
  </g>
  <!-- RCS thruster quads at the corners -->
  <g fill="#AEB6C4">
    <rect x="-48" y="-40" width="10" height="7" rx="1.5"/><rect x="38" y="-40" width="10" height="7" rx="1.5"/>
    <rect x="-48" y="-22" width="10" height="7" rx="1.5"/><rect x="38" y="-22" width="10" height="7" rx="1.5"/>
  </g>
  <!-- docking target + overhead hatch -->
  <rect x="-8" y="-58" width="16" height="7" rx="2" fill="#9AA3B4"/>
  <!-- steerable dish antenna -->
  <path d="M30 -54 L44 -74" stroke="#D2D8E4" stroke-width="2.6" stroke-linecap="round"/>
  <g transform="rotate(-34 46 -78)">
    <ellipse cx="46" cy="-78" rx="13" ry="7" fill="#1A1F2A" stroke="#D2D8E4" stroke-width="2.2"/>
    <ellipse cx="46" cy="-78" rx="6" ry="3" fill="#8E96A6"/>
  </g>
  <!-- rendezvous radar, small dish left -->
  <path d="M-30 -54 L-42 -68" stroke="#D2D8E4" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="-44" cy="-70" r="5" fill="none" stroke="#D2D8E4" stroke-width="2"/>
  <!-- earthlight rim on the shadow side -->
  <path d="M-34 -2 L-38 -34 L-26 -52" fill="none" stroke="#9FE2FF" stroke-width="2.6" opacity=".6" filter="url(#kglow)"/>
</g>

<rect width="400" height="520" filter="url(#grain)" opacity=".05" style="mix-blend-mode:overlay"/>
<rect x="3" y="3" width="394" height="514" fill="none" stroke="#D9A227" stroke-width="2.5" opacity=".45"/>
</svg>
