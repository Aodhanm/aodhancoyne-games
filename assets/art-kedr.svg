<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620" role="img" aria-label="Cabinet art: a lunar lander standing on the Moon, Earth in the black sky above a cratered horizon">
<defs>
  <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#000008"/>
    <stop offset=".5"  stop-color="#03051A"/>
    <stop offset=".78" stop-color="#070B28"/>
  </linearGradient>
  <!-- regolith, lit hard from the right -->
  <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#2B2A34"/>
    <stop offset=".26" stop-color="#54525E"/>
    <stop offset=".58" stop-color="#8E8B97"/>
    <stop offset=".84" stop-color="#C2BFC7"/>
    <stop offset="1"   stop-color="#E4E1E6"/>
  </linearGradient>
  <radialGradient id="earthDisc" cx=".36" cy=".30" r=".88">
    <stop offset="0"   stop-color="#CFF0FF"/>
    <stop offset=".2"  stop-color="#63BCF2"/>
    <stop offset=".5"  stop-color="#2379D6"/>
    <stop offset=".8"  stop-color="#124A9E"/>
    <stop offset="1"   stop-color="#0A2657"/>
  </radialGradient>
  <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#4A3306"/>
    <stop offset=".16" stop-color="#B98A1C"/>
    <stop offset=".36" stop-color="#FFE594"/>
    <stop offset=".58" stop-color="#E0A82A"/>
    <stop offset=".8"  stop-color="#8A5F10"/>
    <stop offset="1"   stop-color="#382404"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#333845"/>
    <stop offset=".26" stop-color="#8F99AD"/>
    <stop offset=".5"  stop-color="#E2E7F0"/>
    <stop offset=".76" stop-color="#8A93A5"/>
    <stop offset="1"   stop-color="#282D38"/>
  </linearGradient>
  <linearGradient id="plume" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#FFFFFF" stop-opacity=".9"/>
    <stop offset=".35" stop-color="#BFE6FF" stop-opacity=".55"/>
    <stop offset="1"   stop-color="#3A7FB8" stop-opacity="0"/>
  </linearGradient>
  <filter id="kglow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ksoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="kdust" x="-60%" y="-60%" width="220%" height="220%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="4" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>

<rect width="400" height="620" fill="url(#space)"/>

<!-- stars, sparse: the sky is airless black -->
<g fill="#FFFFFF">
  <circle cx="34"  cy="44"  r="1.8" opacity=".9"/><circle cx="128" cy="30" r="1.3" opacity=".7"/>
  <circle cx="236" cy="56"  r="1.1" opacity=".55"/><circle cx="318" cy="28" r="1.6" opacity=".85"/>
  <circle cx="372" cy="92"  r="1.2" opacity=".6"/> <circle cx="196" cy="112" r="1"  opacity=".45"/>
  <circle cx="66"  cy="150" r="1.1" opacity=".5"/> <circle cx="348" cy="170" r="1.2" opacity=".55"/>
  <circle cx="18"  cy="236" r="1"   opacity=".4"/>
</g>

<!-- ── Earth, unmistakable and high ── -->
<g transform="translate(292 136)">
  <circle r="88" fill="#4FC3FF" opacity=".14" filter="url(#ksoft)"/>
  <circle r="58" fill="url(#earthDisc)"/>
  <g clip-path="circle(58px at 0 0)">
    <g fill="#3E9E58" opacity=".92">
      <path d="M-40 -26 q14 -12 30 -5 q12 5 5 17 q-9 14 -26 10 q-14 -3 -9 -22Z"/>
      <path d="M-6 6 q19 -7 29 7 q7 12 -7 21 q-17 10 -27 -5 q-7 -14 5 -23Z"/>
      <path d="M20 -38 q16 -3 19 9 q2 10 -12 12 q-14 2 -14 -10 q0 -9 7 -11Z"/>
    </g>
    <g fill="#FFFFFF" opacity=".45">
      <path d="M-56 -10 q24 -12 48 -2 q-20 14 -48 2Z"/>
      <path d="M-18 34 q30 -10 53 4 q-26 12 -53 -4Z"/>
      <path d="M8 -50 q22 -5 38 5 q-19 10 -38 -5Z"/>
    </g>
    <circle r="58" fill="#02040F" opacity=".7" transform="translate(46 0)"/>
  </g>
  <circle r="58" fill="none" stroke="#9FE2FF" stroke-width="2.2" opacity=".7"/>
</g>

<!-- ── the Moon: a clean, close horizon so the place is never in doubt ── -->
<g>
  <!-- distant hills against black -->
  <path d="M0 352 L46 330 L92 350 L140 324 L188 348 L238 326 L292 350 L342 330 L400 348 L400 380 L0 380Z"
        fill="#232230"/>
  <!-- the plain, curving away -->
  <path d="M-20 402 Q200 356 420 402 L420 620 L-20 620Z" fill="url(#ground)"/>
  <!-- horizon rim light -->
  <path d="M-20 402 Q200 356 420 402" fill="none" stroke="#F2EFF4" stroke-width="3" opacity=".75"/>
  <!-- three big craters, each a shadowed bowl with a lit far rim -->
  <g>
    <ellipse cx="74"  cy="468" rx="76" ry="23" fill="#121119"/>
    <path d="M-2 468 a76 23 0 0 1 152 0" fill="none" stroke="#DFDCE4" stroke-width="3.4" opacity=".6"/>
    <ellipse cx="74"  cy="464" rx="62" ry="17" fill="#26252F" opacity=".8"/>

    <ellipse cx="316" cy="524" rx="96" ry="29" fill="#0F0E15"/>
    <path d="M220 524 a96 29 0 0 1 192 0" fill="none" stroke="#E6E3EA" stroke-width="3.8" opacity=".55"/>
    <ellipse cx="316" cy="519" rx="78" ry="21" fill="#232230" opacity=".8"/>

    <ellipse cx="150" cy="586" rx="66" ry="20" fill="#0D0C12"/>
    <path d="M84 586 a66 20 0 0 1 132 0" fill="none" stroke="#D6D3DB" stroke-width="3" opacity=".5"/>
  </g>
</g>

<!-- earthlight wash on the plain -->
<ellipse cx="290" cy="430" rx="190" ry="60" fill="#4FC3FF" opacity=".07" filter="url(#ksoft)"/>

<!-- ── the lander, large and centred ── -->
<g transform="translate(196 340) scale(1.5)">
  <!-- shadow cast left, away from the sun -->
  <ellipse cx="-26" cy="98" rx="82" ry="13" fill="#08070D" opacity=".85"/>

  <!-- dust skirt -->
  <g filter="url(#kdust)" opacity=".45">
    <ellipse cx="0" cy="100" rx="96" ry="12" fill="#D8D5DF"/>
  </g>

  <!-- descent plume, short: it has touched down -->
  <g transform="translate(0 58)">
    <path d="M-16 0 C-12 20 -6 32 0 40 C6 32 12 20 16 0Z" fill="url(#plume)"/>
  </g>

  <!-- legs: four, splayed, with round pads -->
  <g stroke="#B6BDCB" stroke-width="4.6" stroke-linecap="round" fill="none">
    <path d="M-26 26 L-62 88"/><path d="M26 26 L62 88"/>
    <path d="M-12 30 L-30 90"/><path d="M12 30 L30 90"/>
  </g>
  <!-- strut bracing -->
  <g stroke="#8E96A6" stroke-width="2.4" fill="none" opacity=".85">
    <path d="M-44 58 L-20 58"/><path d="M44 58 L20 58"/>
  </g>
  <g fill="#DCE2ED">
    <ellipse cx="-62" cy="91" rx="14" ry="5"/><ellipse cx="62" cy="91" rx="14" ry="5"/>
    <ellipse cx="-30" cy="93" rx="12" ry="4.4"/><ellipse cx="30" cy="93" rx="12" ry="4.4"/>
  </g>

  <!-- descent stage: broad gold-blanketed drum -->
  <path d="M-50 -2 L50 -2 L40 40 L-40 40Z" fill="url(#foil)"/>
  <path d="M-50 -2 L50 -2 L48 5 L-48 5Z" fill="#FFF2C4" opacity=".6"/>
  <g stroke="#4A3306" stroke-width="1.4" opacity=".45">
    <path d="M-34 -2 L-28 40"/><path d="M-14 -2 L-11 40"/><path d="M10 -2 L8 40"/><path d="M32 -2 L26 40"/>
  </g>
  <!-- engine bell -->
  <path d="M-15 40 L15 40 L10 60 L-10 60Z" fill="url(#metal)"/>
  <ellipse cx="0" cy="60" rx="10" ry="3.6" fill="#0A0D15"/>

  <!-- ascent stage: cabin, clearly a machine -->
  <circle cx="0" cy="-38" r="34" fill="url(#metal)"/>
  <circle cx="0" cy="-38" r="34" fill="#0A0D14" opacity=".4" clip-path="inset(0 0 0 64%)"/>
  <g fill="none" stroke="#2B303C" stroke-width="1.5" opacity=".6">
    <path d="M-34 -38 a34 34 0 0 0 68 0"/><path d="M-24 -62 a44 44 0 0 0 0 48"/>
  </g>
  <!-- equipment girdle -->
  <path d="M-34 -32 a34 34 0 0 0 68 0 l0 8 a34 34 0 0 1 -68 0Z" fill="#626B7E"/>
  <path d="M-34 -32 a34 34 0 0 0 68 0" fill="none" stroke="#D2D8E4" stroke-width="1.8" opacity=".75"/>
  <!-- viewport -->
  <g transform="translate(-10 -48) rotate(-16)">
    <rect x="-10" y="-6.5" width="20" height="13" rx="3" fill="#04091A"/>
    <rect x="-10" y="-6.5" width="20" height="13" rx="3" fill="none" stroke="#D2D8E4" stroke-width="2.6"/>
    <path d="M-7.5 -4 L1 -4" stroke="#9FE2FF" stroke-width="2.2" opacity=".85" stroke-linecap="round"/>
  </g>
  <!-- docking probe -->
  <path d="M0 -72 L0 -88" stroke="#D2D8E4" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M-10 -88 L10 -88 L5 -97 L-5 -97Z" fill="#A3ABBC"/>
  <!-- dish antenna -->
  <path d="M24 -60 L38 -78" stroke="#D2D8E4" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="40" cy="-81" rx="9" ry="5" fill="none" stroke="#D2D8E4" stroke-width="2.2" transform="rotate(-34 40 -81)"/>
  <!-- red star -->
  <g transform="translate(17 -24) scale(.3)">
    <path d="M0 -30 L8.8 -9.3 31.5 -9.3 13.2 3.6 20.1 25.2 0 12 -20.1 25.2 -13.2 3.6 -31.5 -9.3 -8.8 -9.3Z" fill="#E01020"/>
  </g>
  <!-- earthlight rim on the shadow side -->
  <path d="M-34 -38 a34 34 0 0 1 15 -29" fill="none" stroke="#9FE2FF" stroke-width="3" opacity=".65" filter="url(#kglow)"/>
</g>

<rect width="400" height="620" filter="url(#grain)" opacity=".05" style="mix-blend-mode:overlay"/>
<rect x="3" y="3" width="394" height="614" fill="none" stroke="#E0A82A" stroke-width="2.5" opacity=".45"/>
</svg>
