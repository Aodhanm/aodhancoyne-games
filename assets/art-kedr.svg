<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620" role="img" aria-label="Arcade side art: a rocket climbing into space above a red star and the curve of the Earth">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"    stop-color="#05030F"/>
    <stop offset=".34"  stop-color="#160A3A"/>
    <stop offset=".62"  stop-color="#4A0E52"/>
    <stop offset=".84"  stop-color="#9A1440"/>
    <stop offset="1"    stop-color="#E8451B"/>
  </linearGradient>
  <radialGradient id="burst" cx=".5" cy="1" r=".95">
    <stop offset="0"   stop-color="#FFD23F" stop-opacity=".85"/>
    <stop offset=".35" stop-color="#FF6B1A" stop-opacity=".35"/>
    <stop offset="1"   stop-color="#FF2D95" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#6B7183"/>
    <stop offset=".22" stop-color="#E8ECF4"/>
    <stop offset=".52" stop-color="#FFFFFF"/>
    <stop offset=".80" stop-color="#AEB6C6"/>
    <stop offset="1"   stop-color="#4C5262"/>
  </linearGradient>
  <linearGradient id="nose" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#B0121B"/>
    <stop offset=".35" stop-color="#FF3B30"/>
    <stop offset=".7"  stop-color="#E01020"/>
    <stop offset="1"   stop-color="#7A0A12"/>
  </linearGradient>
  <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#FFFFFF"/>
    <stop offset=".18" stop-color="#FFF3A0"/>
    <stop offset=".45" stop-color="#FFB020"/>
    <stop offset=".75" stop-color="#FF4A10"/>
    <stop offset="1"   stop-color="#C01010" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#33E0FF"/>
    <stop offset=".25" stop-color="#1064C8"/>
    <stop offset="1"   stop-color="#050A28"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
</defs>

<rect width="400" height="620" fill="url(#sky)"/>

<!-- sunburst rays from the horizon -->
<g opacity=".55">
  <path d="M200 620 L40 300 L92 296Z" fill="#FF7A1A" opacity=".30"/>
  <path d="M200 620 L120 250 L156 250Z" fill="#FFD23F" opacity=".24"/>
  <path d="M200 620 L210 236 L246 244Z" fill="#FF7A1A" opacity=".28"/>
  <path d="M200 620 L318 288 L356 310Z" fill="#FFD23F" opacity=".20"/>
</g>
<ellipse cx="200" cy="616" rx="230" ry="150" fill="url(#burst)"/>

<!-- starfield -->
<g fill="#FFFFFF">
  <circle cx="38"  cy="46"  r="2.1" opacity=".95"/>
  <circle cx="96"  cy="112" r="1.3" opacity=".65"/>
  <circle cx="150" cy="40"  r="1.6" opacity=".8"/>
  <circle cx="248" cy="86"  r="1.2" opacity=".6"/>
  <circle cx="312" cy="44"  r="2.3" opacity=".95"/>
  <circle cx="360" cy="136" r="1.4" opacity=".7"/>
  <circle cx="66"  cy="196" r="1.5" opacity=".7"/>
  <circle cx="342" cy="222" r="1.2" opacity=".55"/>
  <circle cx="22"  cy="300" r="1.3" opacity=".5"/>
  <circle cx="378" cy="330" r="1.5" opacity=".5"/>
  <circle cx="128" cy="168" r="1"   opacity=".45"/>
  <circle cx="286" cy="164" r="1"   opacity=".45"/>
</g>
<!-- four-point sparkles -->
<g fill="#FFFFFF" opacity=".9">
  <path d="M300 108 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
  <path d="M74 128 l2.4 7 7 2.4 -7 2.4 -2.4 7 -2.4 -7 -7 -2.4 7 -2.4z"/>
</g>

<!-- moon -->
<g>
  <circle cx="318" cy="126" r="46" fill="#12162E" opacity=".9" filter="url(#soft)"/>
  <circle cx="318" cy="126" r="38" fill="#DCD6E8"/>
  <circle cx="318" cy="126" r="38" fill="#9A93B8" opacity=".45"
          clip-path="inset(0 0 0 52%)"/>
  <g fill="#A79FC0" opacity=".75">
    <circle cx="304" cy="112" r="7"/>
    <circle cx="328" cy="140" r="5"/>
    <circle cx="310" cy="146" r="3.4"/>
    <circle cx="333" cy="110" r="3"/>
  </g>
</g>

<!-- red star, high above -->
<g transform="translate(96 92) scale(.92)" filter="url(#glow)">
  <path d="M0 -30 L8.8 -9.3 31.5 -9.3 13.2 3.6 20.1 25.2 0 12 -20.1 25.2 -13.2 3.6 -31.5 -9.3 -8.8 -9.3Z"
        fill="#FF1F2E" stroke="#FFD23F" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- earth limb at the base -->
<g>
  <ellipse cx="200" cy="700" rx="300" ry="150" fill="url(#earth)"/>
  <ellipse cx="200" cy="700" rx="300" ry="150" fill="none" stroke="#7FF0FF" stroke-width="4" opacity=".85"/>
  <ellipse cx="200" cy="704" rx="320" ry="162" fill="none" stroke="#33E0FF" stroke-width="14" opacity=".18" filter="url(#soft)"/>
</g>

<!-- ── the rocket, climbing right ── -->
<g transform="translate(196 330) rotate(24)">
  <!-- exhaust -->
  <g transform="translate(0 96)">
    <path d="M-30 0 C-20 78 -10 132 0 176 C10 132 20 78 30 0Z" fill="url(#flame)" opacity=".95"/>
    <path d="M-16 0 C-11 56 -5 96 0 124 C5 96 11 56 16 0Z" fill="#FFF6C2" opacity=".95"/>
    <path d="M-7 0 C-5 40 -2 66 0 84 C2 66 5 40 7 0Z" fill="#FFFFFF"/>
  </g>
  <!-- fins -->
  <path d="M-26 34 L-58 104 L-26 92Z" fill="#C3121F"/>
  <path d="M26 34 L58 104 L26 92Z"    fill="#8E0C16"/>
  <!-- body -->
  <rect x="-26" y="-78" width="52" height="174" rx="7" fill="url(#hull)"/>
  <!-- nose -->
  <path d="M-26 -78 C-26 -128 -10 -164 0 -182 C10 -164 26 -128 26 -78Z" fill="url(#nose)"/>
  <!-- window -->
  <circle cx="0" cy="-52" r="14" fill="#07162E"/>
  <circle cx="0" cy="-52" r="14" fill="none" stroke="#DCE2EE" stroke-width="4"/>
  <circle cx="-4.5" cy="-57" r="4.2" fill="#7FF0FF" opacity=".9"/>
  <!-- banding -->
  <rect x="-26" y="-14" width="52" height="9"  fill="#C3121F" opacity=".9"/>
  <rect x="-26" y="30"  width="52" height="6"  fill="#3A4050" opacity=".65"/>
  <!-- CCCP mark -->
  <text x="0" y="14" font-family="Futura,'Avenir Next',Helvetica,Arial,sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.5"
        text-anchor="middle" fill="#B0121B">CCCP</text>
  <!-- highlight -->
  <rect x="-15" y="-72" width="7" height="162" rx="3.5" fill="#FFFFFF" opacity=".5"/>
</g>

<!-- speed streaks -->
<g stroke="#7FF0FF" stroke-linecap="round" opacity=".55">
  <path d="M108 470 L150 404" stroke-width="3"/>
  <path d="M74 430  L104 382" stroke-width="2"/>
  <path d="M142 522 L176 466" stroke-width="2"/>
</g>

<!-- panel border, like a printed sticker edge -->
<rect x="3" y="3" width="394" height="614" fill="none" stroke="#FFD23F" stroke-width="2.5" opacity=".5"/>
</svg>
