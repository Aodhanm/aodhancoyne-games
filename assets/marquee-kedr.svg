<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-label="Marquee: КЕДР, Лунный корабль, with a lunar module descending on a flame plume over a mountain ridge">
<defs>
  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#E6E9F0"/>
    <stop offset=".62" stop-color="#AFB6C4"/><stop offset="1" stop-color="#F2F4F8"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF4C4"/><stop offset=".3" stop-color="#FFD23F"/>
    <stop offset=".56" stop-color="#F5A81A"/><stop offset=".74" stop-color="#FFDE72"/>
    <stop offset="1" stop-color="#C97C0A"/>
  </linearGradient>
  <radialGradient id="plumeOuter" cx=".5" cy=".84" r=".72">
    <stop offset="0" stop-color="#FFF06A"/><stop offset=".3" stop-color="#FFC21A"/>
    <stop offset=".62" stop-color="#FF7A10"/><stop offset=".88" stop-color="#E8400A"/>
    <stop offset="1" stop-color="#E8400A" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="plumeInner" cx=".5" cy=".86" r=".66">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".34" stop-color="#FFF2A0"/>
    <stop offset=".72" stop-color="#FFC21A"/><stop offset="1" stop-color="#FF8A12" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="earthBig" cx=".34" cy=".28" r=".9">
    <stop offset="0" stop-color="#CFF0FF"/><stop offset=".2" stop-color="#63BCF2"/>
    <stop offset=".5" stop-color="#2379D6"/><stop offset=".8" stop-color="#10428E"/>
    <stop offset="1" stop-color="#07204B"/>
  </radialGradient>
  <radialGradient id="sunSmall" cx=".4" cy=".35" r=".7">
    <stop offset="0" stop-color="#FFFDE8"/><stop offset=".45" stop-color="#FFD23F"/>
    <stop offset="1" stop-color="#F08A1E"/>
  </radialGradient>
  <filter id="mqsoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>

<rect width="760" height="190" fill="#000000"/>

<!-- scattered stars and small planets, as on the original -->
<g fill="#FFFFFF">
  <circle cx="470" cy="24" r="3"/><circle cx="512" cy="52" r="1.8"/><circle cx="620" cy="18" r="2.2"/>
  <circle cx="700" cy="46" r="1.6"/><circle cx="736" cy="96" r="2"/><circle cx="392" cy="16" r="1.6"/>
  <circle cx="88"  cy="22" r="1.8"/><circle cx="30"  cy="60" r="1.4"/>
</g>
<g transform="translate(706 34)">
  <circle r="20" fill="#FFC21A" opacity=".22" filter="url(#mqsoft)"/>
  <circle r="10" fill="url(#sunSmall)"/>
  <g stroke="#FFD23F" stroke-width="1.6" stroke-linecap="round" opacity=".75">
    <path d="M0 -16 L0 -21"/><path d="M0 16 L0 21"/><path d="M-16 0 L-21 0"/><path d="M16 0 L21 0"/>
    <path d="M-11 -11 L-15 -15"/><path d="M11 11 L15 15"/><path d="M11 -11 L15 -15"/><path d="M-11 11 L-15 15"/>
  </g>
</g>
<circle cx="724" cy="132" r="5" fill="#E8400A"/>
<circle cx="404" cy="52" r="3.4" fill="#E8E3F0" opacity=".85"/>

<!-- ── Earth, large, hanging behind the lander ── -->
<g transform="translate(546 104)">
  <circle r="118" fill="#4FC3FF" opacity=".12" filter="url(#mqsoft)"/>
  <circle r="86" fill="url(#earthBig)"/>
  <g clip-path="circle(86px at 0 0)">
    <!-- Africa and Europe, the face that reads fastest -->
    <path d="M-14 -26 q17 -10 32 -4 q11 6 9 17 l13 6 q6 9 -4 15 l-11 4 q-2 15 -13 26
             q-9 9 -17 22 q-6 11 -13 6 q-6 -6 -2 -17 q-9 -13 -11 -30 q-2 -17 -6 -26
             q-4 -11 8 -13 q7 -2 15 -6Z" fill="#3E9E58" opacity=".95"/>
    <path d="M-26 -56 q20 -7 37 -2 q7 4 2 9 q-11 6 -22 4 q-13 -2 -17 -11Z" fill="#3E9E58" opacity=".9"/>
    <path d="M22 -32 q13 -4 19 6 q4 7 -6 11 q-11 4 -17 -4 q-4 -7 4 -13Z" fill="#C8A24E" opacity=".85"/>
    <path d="M-22 -34 q26 -9 48 -2 q6 7 -4 13 q-24 7 -43 2 q-7 -6 -1 -13Z" fill="#D2AC5C" opacity=".5"/>
    <path d="M31 15 q7 6 4 15 q-4 7 -9 2 q-4 -9 5 -17Z" fill="#3E9E58" opacity=".9"/>
    <path d="M-82 4 q15 -9 24 2 q7 11 -2 26 q-9 17 -20 11 q-9 -6 -7 -20 q0 -11 5 -19Z" fill="#3E9E58" opacity=".8"/>
    <g fill="#FFFFFF" opacity=".38">
      <path d="M-82 -18 q35 -17 71 -4 q-30 20 -71 4Z"/>
      <path d="M-30 48 q45 -15 78 6 q-39 19 -78 -6Z"/>
      <path d="M-4 -70 q34 -9 60 4 q-30 15 -60 -4Z"/>
    </g>
    <path d="M-86 -62 q86 -22 172 0 l0 -26 l-172 0Z" fill="#FFFFFF" opacity=".5"/>
    <path d="M-86 62 q86 22 172 0 l0 26 l-172 0Z" fill="#FFFFFF" opacity=".45"/>
    <circle r="86" fill="#02040F" opacity=".55" transform="translate(72 0)"/>
  </g>
  <circle r="86" fill="none" stroke="#9FE2FF" stroke-width="2.6" opacity=".7"/>
</g>

<!-- ── lunar module, white line art, right of centre ── -->
<g transform="translate(596 96) scale(.82)">
  <!-- descent stage -->
  <path d="M-38 22 L-30 -4 L30 -4 L38 22 L30 42 L-30 42Z" fill="#F4F6FA" stroke="#0A0A0A" stroke-width="2.4"/>
  <g stroke="#0A0A0A" stroke-width="1.6" opacity=".8">
    <path d="M-22 -4 L-19 42"/><path d="M-6 -4 L-5 42"/><path d="M8 -4 L7 42"/><path d="M22 -4 L18 42"/>
  </g>
  <!-- legs and pads -->
  <g stroke="#F4F6FA" stroke-width="4.4" stroke-linecap="round" fill="none">
    <path d="M-32 22 L-66 76"/><path d="M32 22 L66 76"/><path d="M-20 36 L-46 74"/><path d="M20 36 L46 74"/>
  </g>
  <g fill="#F4F6FA" stroke="#0A0A0A" stroke-width="1.8">
    <ellipse cx="-66" cy="78" rx="13" ry="4.6"/><ellipse cx="66" cy="78" rx="13" ry="4.6"/>
    <ellipse cx="-46" cy="76" rx="10" ry="3.8"/><ellipse cx="46" cy="76" rx="10" ry="3.8"/>
  </g>
  <!-- engine + exhaust -->
  <path d="M-10 42 L10 42 L7 58 L-7 58Z" fill="#F4F6FA" stroke="#0A0A0A" stroke-width="2"/>
  <path d="M-14 58 C-10 84 -5 100 0 114 C5 100 10 84 14 58Z" fill="#FFF2A0"/>
  <!-- ascent stage -->
  <path d="M-24 -4 L-27 -26 L-18 -40 L18 -40 L27 -26 L24 -4Z" fill="#F4F6FA" stroke="#0A0A0A" stroke-width="2.4"/>
  <g fill="#0A0A0A">
    <path d="M-17 -30 L-6 -33 L-7 -21 L-17 -20Z"/><path d="M6 -33 L17 -30 L17 -20 L8 -21Z"/>
  </g>
  <rect x="-7" y="-16" width="14" height="12" rx="2" fill="#F4F6FA" stroke="#0A0A0A" stroke-width="1.8"/>
  <!-- antenna -->
  <path d="M20 -42 L32 -60" stroke="#F4F6FA" stroke-width="2.6" stroke-linecap="round"/>
  <ellipse cx="34" cy="-63" rx="10" ry="5.4" fill="#F4F6FA" stroke="#0A0A0A" stroke-width="1.8" transform="rotate(-34 34 -63)"/>
  <path d="M0 -44 L0 -56" stroke="#F4F6FA" stroke-width="2.6" stroke-linecap="round"/>
  <!-- red star, the one thing that is ours -->
  <g transform="translate(0 -10) scale(.2)">
    <path d="M0 -30 L8.8 -9.3 31.5 -9.3 13.2 3.6 20.1 25.2 0 12 -20.1 25.2 -13.2 3.6 -31.5 -9.3 -8.8 -9.3Z" fill="#E01020"/>
  </g>
</g>

<!-- ── jagged ridge across the base ── -->
<path d="M0 190 L0 168 L34 148 L62 166 L92 140 L124 164 L152 150 L186 172 L214 156 L248 176
         L286 152 L318 174 L352 160 L384 178 L420 158 L452 176 L492 162 L524 180 L566 164
         L602 182 L644 166 L684 184 L722 170 L760 186 L760 190Z"
      fill="#F4F6FA"/>
<path d="M0 190 L0 176 L34 158 L62 174 L92 152 L124 172 L152 160 L186 180 L214 166 L248 182
         L286 162 L318 180 L352 168 L384 184 L420 166 L452 182 L492 170 L524 186 L566 172
         L602 186 L644 174 L684 188 L722 178 L760 190Z"
      fill="#C9CDD6"/>

<!-- ── title: ЛУННЫЙ КОРАБЛЬ in silver above КЕДР in gold ── -->
<g transform="translate(40 62)">
  <text x="6" y="5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="30" font-weight="800" letter-spacing="1.5" fill="#000000">ЛУННЫЙ</text>
  <text x="0" y="0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="30" font-weight="800" letter-spacing="1.5"
        fill="url(#silver)" stroke="#000000" stroke-width="1.6" paint-order="stroke">ЛУННЫЙ</text>

  <text x="7" y="63" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="70" font-weight="800" letter-spacing="3" fill="#000000">КЕДР</text>
  <text x="0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="70" font-weight="800" letter-spacing="3"
        fill="url(#gold)" stroke="#000000" stroke-width="2.6" paint-order="stroke">КЕДР</text>
</g>

<!-- credit line, as on the original -->
<text x="16" y="184" font-family="Helvetica,Arial,sans-serif" font-size="7"
      letter-spacing=".8" fill="#0A0A0A" opacity=".85">AODHAN COYNE · MMXXVI</text>
</svg>
