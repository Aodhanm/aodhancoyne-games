<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="Cabinet art: a submarine surfaced at dusk launching a missile over a city skyline">
<defs>
  <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#050912"/><stop offset=".26" stop-color="#060B18"/>
    <stop offset=".5" stop-color="#0D1A36"/><stop offset=".68" stop-color="#11284E"/>
    <stop offset=".78" stop-color="#1B3A66"/><stop offset=".82" stop-color="#2A5A8C"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3E4E72"/><stop offset=".1" stop-color="#1B2B50"/>
    <stop offset=".45" stop-color="#0B1836"/><stop offset="1" stop-color="#02050F"/>
  </linearGradient>
  <radialGradient id="sundisc" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#F4F8FF"/><stop offset=".42" stop-color="#C9DCF2"/>
    <stop offset=".78" stop-color="#8FB4D8"/><stop offset="1" stop-color="#4C7FC4"/>
  </radialGradient>
  <linearGradient id="subHull" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#98A0B2"/><stop offset=".2" stop-color="#5C6373"/>
    <stop offset=".55" stop-color="#2A3039"/><stop offset="1" stop-color="#090C12"/>
  </linearGradient>
  <linearGradient id="sailGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#131720"/><stop offset=".52" stop-color="#3B424F"/>
    <stop offset=".84" stop-color="#7D8494"/><stop offset="1" stop-color="#ADB3C1"/>
  </linearGradient>
  <linearGradient id="msBody" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#464C5A"/><stop offset=".2" stop-color="#B4BBC9"/>
    <stop offset=".44" stop-color="#F6F8FC"/><stop offset=".7" stop-color="#BCC2CE"/>
    <stop offset=".9" stop-color="#6A7180"/><stop offset="1" stop-color="#2C313B"/>
  </linearGradient>
  <linearGradient id="msFlame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".18" stop-color="#FFF6C0"/>
    <stop offset=".46" stop-color="#FFB42A"/><stop offset=".76" stop-color="#FF5A14"/>
    <stop offset="1" stop-color="#8E1206" stop-opacity="0"/>
  </linearGradient>
  <filter id="mg" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ms" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="spray" x="-60%" y="-60%" width="220%" height="220%">
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <filter id="grain2" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="4" seed="5"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>

<rect width="400" height="520" fill="url(#dusk)"/>

<g fill="#FFFFFF">
  <circle cx="36" cy="26" r="1.6" opacity=".9"/><circle cx="118" cy="58" r="1" opacity=".5"/>
  <circle cx="214" cy="22" r="1.3" opacity=".7"/><circle cx="352" cy="44" r="1.5" opacity=".8"/>
</g>

<!-- cloud bands -->
<g opacity=".45">
  <path d="M-10 196 q90 -16 180 0 q90 16 240 -4 l0 14 q-150 22 -240 4 q-90 -18 -180 0Z" fill="#1E3A66" opacity=".6"/>
  <path d="M-10 234 q120 -12 220 2 q100 14 200 -6 l0 11 q-100 20 -200 6 q-100 -14 -220 -2Z" fill="#2A5A8C" opacity=".45"/>
</g>

<circle cx="300" cy="318" r="100" fill="#5C9BD6" opacity=".18" filter="url(#ms)"/>
<circle cx="300" cy="318" r="44" fill="url(#sundisc)"/>

<!-- radar rings, echoing the marquee -->
<g transform="translate(96 352)" opacity=".5">
  <g fill="none" stroke="#39FF88" stroke-width="1.2">
    <circle r="40"/><circle r="70"/><circle r="102"/>
  </g>
  <g stroke="#39FF88" stroke-width="1" opacity=".5">
    <path d="M-102 0 L102 0"/><path d="M-72 -72 L72 72"/><path d="M72 -72 L-72 72"/>
  </g>
  <path d="M0 0 L-96 -34 A102 102 0 0 1 -34 -96Z" fill="#39FF88" opacity=".12"/>
</g>

<!-- skyline -->
<g>
  <g fill="#090C18">
    <rect x="4" y="268" width="22" height="76"/><rect x="30" y="244" width="16" height="100"/>
    <rect x="50" y="280" width="26" height="64"/><rect x="80" y="226" width="20" height="118"/>
    <rect x="104" y="260" width="14" height="84"/><rect x="122" y="236" width="26" height="108"/>
    <rect x="152" y="274" width="18" height="70"/><rect x="174" y="216" width="24" height="128"/>
    <rect x="202" y="256" width="16" height="88"/><rect x="222" y="278" width="22" height="66"/>
    <rect x="248" y="232" width="18" height="112"/><rect x="270" y="264" width="26" height="80"/>
    <rect x="300" y="246" width="18" height="98"/><rect x="322" y="280" width="16" height="64"/>
    <rect x="342" y="258" width="24" height="86"/><rect x="370" y="272" width="26" height="72"/>
  </g>
  <g stroke="#090C18" stroke-width="3">
    <path d="M90 226 L90 202"/><path d="M186 216 L186 188"/><path d="M257 232 L257 212"/>
  </g>
  <g fill="#8FB4D8" opacity=".6">
    <rect x="98" y="226" width="2" height="118"/><rect x="196" y="216" width="2" height="128"/>
    <rect x="264" y="232" width="2" height="112"/><rect x="336" y="258" width="2" height="86"/>
  </g>
  <g fill="#FFD98A" opacity=".8">
    <rect x="35" y="256" width="3" height="4.5"/><rect x="40" y="272" width="3" height="4.5"/>
    <rect x="85" y="240" width="3" height="4.5"/><rect x="92" y="258" width="3" height="4.5"/>
    <rect x="128" y="250" width="3" height="4.5"/><rect x="138" y="268" width="3" height="4.5"/>
    <rect x="179" y="230" width="3" height="4.5"/><rect x="189" y="250" width="3" height="4.5"/>
    <rect x="253" y="246" width="3" height="4.5"/><rect x="276" y="278" width="3" height="4.5"/>
    <rect x="305" y="260" width="3" height="4.5"/><rect x="348" y="272" width="3" height="4.5"/>
  </g>
</g>
<rect x="0" y="322" width="400" height="26" fill="#4C7FC4" opacity=".22" filter="url(#ms)"/>

<!-- sea -->
<rect x="0" y="344" width="400" height="176" fill="url(#water)"/>
<g fill="#BCD8F2" opacity=".26">
  <rect x="290" y="352" width="20" height="3" rx="1.5"/><rect x="284" y="368" width="32" height="3" rx="1.5"/>
  <rect x="276" y="386" width="46" height="3.5" rx="1.75"/><rect x="266" y="408" width="64" height="3.5" rx="1.75"/>
  <rect x="254" y="434" width="86" height="4" rx="2"/><rect x="240" y="466" width="112" height="4" rx="2"/>
  <rect x="224" y="502" width="142" height="4.5" rx="2.25"/>
</g>
<g opacity=".5">
  <ellipse cx="66" cy="374" rx="80" ry="3.6" fill="#4A5D86"/>
  <ellipse cx="318" cy="392" rx="86" ry="4" fill="#3E5077"/>
  <ellipse cx="130" cy="424" rx="110" ry="4.6" fill="#33456B"/>
  <ellipse cx="290" cy="468" rx="120" ry="5.4" fill="#2A3A5D"/>
  <ellipse cx="100" cy="506" rx="140" ry="6.4" fill="#22314F"/>
</g>

<!-- ══ SUBMARINE ══ -->
<g transform="translate(160 442)">
  <ellipse cx="0" cy="26" rx="164" ry="20" fill="#081733" opacity=".9"/>
  <ellipse cx="0" cy="20" rx="142" ry="12" fill="#5FD0FF" opacity=".16"/>
  <path d="M-140 14 C-104 -16 104 -16 140 14 C100 32 -100 32 -140 14Z" fill="url(#subHull)"/>
  <path d="M-140 14 C-104 -16 104 -16 140 14" fill="none" stroke="#BCD8F2" stroke-width="2.6" opacity=".6"/>
  <path d="M-140 14 C-100 30 100 30 140 14" fill="none" stroke="#BFE4FF" stroke-width="2.6" opacity=".45"/>
  <path d="M-140 14 C-104 -16 104 -16 140 14 C104 -4 -104 -4 -140 14Z" fill="#99A1B2" opacity=".45"/>
  <!-- sail -->
  <path d="M-28 -4 L-21 -58 L21 -58 L28 -4Z" fill="url(#sailGrad)"/>
  <path d="M-21 -58 L21 -58 L20 -52 L-20 -52Z" fill="#B7BDCA" opacity=".7"/>
  <path d="M21 -58 L28 -4" stroke="#BCD8F2" stroke-width="2.2" opacity=".7" fill="none"/>
  <!-- proper DPRK flag on the sail: blue / white / red with white disc and red star -->
  <g transform="translate(0 -34)">
    <rect x="-18" y="-11" width="36" height="22" fill="#024FA2"/>
    <rect x="-18" y="-7.6" width="36" height="15.2" fill="#F7F7F7"/>
    <rect x="-18" y="-6.2" width="36" height="12.4" fill="#ED1C27"/>
    <circle cx="-4.5" cy="0" r="5.2" fill="#F7F7F7"/>
    <g transform="translate(-4.5 0) scale(.145)">
      <path d="M0 -30 L8.8 -9.3 31.5 -9.3 13.2 3.6 20.1 25.2 0 12 -20.1 25.2 -13.2 3.6 -31.5 -9.3 -8.8 -9.3Z" fill="#ED1C27"/>
    </g>
  </g>
  <g stroke="#C2C8D6" stroke-width="3.2" stroke-linecap="round">
    <path d="M-7 -58 L-7 -90"/><path d="M7 -58 L7 -76"/>
  </g>
  <circle cx="-7" cy="-92" r="3.2" fill="#ED1C27"/>
  <!-- open launch tube -->
  <ellipse cx="68" cy="0" rx="21" ry="7" fill="#04070E"/>
  <ellipse cx="68" cy="0" rx="21" ry="7" fill="none" stroke="#98A0B0" stroke-width="2"/>
  <text x="-96" y="12" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700"
        fill="#D6DCE8" opacity=".8" letter-spacing="1.4">815</text>
  <g stroke="#0D1017" opacity=".45" stroke-width="1.5">
    <path d="M-96 2 L-96 24"/><path d="M-56 -3 L-56 27"/><path d="M104 2 L104 24"/>
  </g>
  <g filter="url(#spray)" opacity=".5">
    <ellipse cx="-140" cy="16" rx="30" ry="8" fill="#DCEBFF"/><ellipse cx="142" cy="16" rx="26" ry="7" fill="#DCEBFF"/>
  </g>
</g>

<!-- launch steam -->
<g filter="url(#spray)" opacity=".7">
  <ellipse cx="232" cy="424" rx="52" ry="24" fill="#D8E2F0" opacity=".35"/>
  <ellipse cx="236" cy="396" rx="36" ry="20" fill="#FFFFFF" opacity=".24"/>
</g>

<!-- ══ MISSILE — whole body in frame, nose to plume ══ -->
<g transform="translate(252 250) rotate(16)">
  <g transform="translate(0 54)">
    <path d="M-18 0 C-13 72 -5 120 0 156 C5 120 13 72 18 0Z" fill="url(#msFlame)" opacity=".95"/>
    <path d="M-9 0 C-6 50 -3 82 0 104 C3 82 6 50 9 0Z" fill="#FFF6C2" opacity=".95"/>
    <path d="M-4 0 C-2.6 34 -1.2 54 0 70 C1.2 54 2.6 34 4 0Z" fill="#FFFFFF"/>
  </g>
  <path d="M-15 16 L-35 66 L-15 57Z" fill="#A50E16"/>
  <path d="M15 16 L35 66 L15 57Z"    fill="#6E0810"/>
  <rect x="-15" y="-62" width="30" height="116" rx="4.5" fill="url(#msBody)"/>
  <path d="M-15 -62 C-15 -96 -6 -122 0 -133 C6 -122 15 -96 15 -62Z" fill="#ED1C27"/>
  <path d="M-15 -62 C-15 -96 -6 -122 0 -133" fill="none" stroke="#FF9B9B" stroke-width="1.8" opacity=".6"/>
  <rect x="-15" y="-36" width="30" height="6.5" fill="#ED1C27" opacity=".92"/>
  <rect x="-15" y="12" width="30" height="4.5" fill="#262B34" opacity=".7"/>
  <rect x="-8.5" y="-56" width="4" height="106" rx="2" fill="#FFFFFF" opacity=".6"/>
</g>

<!-- reticle -->
<g stroke="#39FF88" stroke-width="2" fill="none" opacity=".8" filter="url(#mg)">
  <circle cx="96" cy="252" r="22"/>
  <path d="M96 222 L96 238 M96 266 L96 282 M66 252 L82 252 M110 252 L126 252"/>
</g>

<rect width="400" height="520" filter="url(#grain2)" opacity=".05" style="mix-blend-mode:overlay"/>
<rect x="3" y="3" width="394" height="514" fill="none" stroke="#39FF88" stroke-width="2.5" opacity=".4"/>
</svg>
