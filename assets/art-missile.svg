<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620" role="img" aria-label="Cabinet art: a submarine surfaced at dusk launching a missile, a city skyline on the horizon">
<defs>
  <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#02040D"/>
    <stop offset=".2"  stop-color="#0A1230"/>
    <stop offset=".42" stop-color="#27214F"/>
    <stop offset=".56" stop-color="#6B2352"/>
    <stop offset=".66" stop-color="#C4402A"/>
    <stop offset=".72" stop-color="#F08A1E"/>
    <stop offset=".76" stop-color="#FFC745"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#3E4E72"/>
    <stop offset=".08" stop-color="#1B2B50"/>
    <stop offset=".4"  stop-color="#0B1836"/>
    <stop offset="1"   stop-color="#02050F"/>
  </linearGradient>
  <radialGradient id="sundisc" cx=".5" cy=".5" r=".5">
    <stop offset="0"   stop-color="#FFF8CF"/>
    <stop offset=".42" stop-color="#FFD24A"/>
    <stop offset=".78" stop-color="#FF8A1E"/>
    <stop offset="1"   stop-color="#E04A10"/>
  </radialGradient>
  <!-- hull: lit hot from the right by the sun, deep shadow to the left -->
  <linearGradient id="subHull" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#8C93A4"/>
    <stop offset=".18" stop-color="#5C6373"/>
    <stop offset=".5"  stop-color="#2E3440"/>
    <stop offset=".82" stop-color="#171B24"/>
    <stop offset="1"   stop-color="#0A0D13"/>
  </linearGradient>
  <linearGradient id="sailGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#151920"/>
    <stop offset=".5"  stop-color="#3B424F"/>
    <stop offset=".82" stop-color="#79808F"/>
    <stop offset="1"   stop-color="#A8AEBC"/>
  </linearGradient>
  <linearGradient id="msBody" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#4E5462"/>
    <stop offset=".2"  stop-color="#AEB5C4"/>
    <stop offset=".42" stop-color="#F2F5FA"/>
    <stop offset=".68" stop-color="#C0C6D2"/>
    <stop offset=".88" stop-color="#6E7584"/>
    <stop offset="1"   stop-color="#31363F"/>
  </linearGradient>
  <linearGradient id="msFlame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#FFFFFF"/>
    <stop offset=".16" stop-color="#FFF6C0"/>
    <stop offset=".42" stop-color="#FFB42A"/>
    <stop offset=".72" stop-color="#FF5A14"/>
    <stop offset="1"   stop-color="#8E1206" stop-opacity="0"/>
  </linearGradient>
  <filter id="mg" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ms" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="spray" x="-60%" y="-60%" width="220%" height="220%">
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <filter id="grain2" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="4" seed="5"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>

<rect width="400" height="620" fill="url(#dusk)"/>

<!-- stars in the upper band -->
<g fill="#FFFFFF">
  <circle cx="40"  cy="32"  r="1.7" opacity=".9"/><circle cx="126" cy="70" r="1.1" opacity=".55"/>
  <circle cx="232" cy="28"  r="1.4" opacity=".75"/><circle cx="330" cy="60" r="1.1" opacity=".5"/>
  <circle cx="372" cy="22"  r="1.8" opacity=".9"/><circle cx="78"  cy="112" r="1"  opacity=".45"/>
</g>

<!-- high cloud bands catching the last light -->
<g opacity=".5">
  <path d="M-10 250 q90 -18 180 0 q90 18 240 -4 l0 16 q-150 24 -240 4 q-90 -20 -180 0Z" fill="#8A2E5E" opacity=".55"/>
  <path d="M-10 296 q120 -14 220 2 q100 16 200 -6 l0 12 q-100 22 -200 6 q-100 -16 -220 -2Z" fill="#C4402A" opacity=".45"/>
</g>

<!-- the sun, sitting on the horizon behind the city -->
<circle cx="292" cy="392" r="120" fill="#FF8A1E" opacity=".20" filter="url(#ms)"/>
<circle cx="292" cy="392" r="54" fill="url(#sundisc)"/>

<!-- ── city skyline ── -->
<g>
  <g fill="#090C18">
    <rect x="4"   y="330" width="24" height="92"/><rect x="32" y="300" width="18" height="122"/>
    <rect x="54"  y="344" width="28" height="78"/><rect x="86" y="276" width="22" height="146"/>
    <rect x="112" y="318" width="16" height="104"/><rect x="132" y="288" width="28" height="134"/>
    <rect x="164" y="334" width="20" height="88"/><rect x="188" y="264" width="26" height="158"/>
    <rect x="218" y="312" width="18" height="110"/><rect x="240" y="340" width="24" height="82"/>
    <rect x="268" y="284" width="20" height="138"/><rect x="292" y="322" width="28" height="100"/>
    <rect x="324" y="300" width="20" height="122"/><rect x="348" y="342" width="18" height="80"/>
    <rect x="370" y="316" width="26" height="106"/>
  </g>
  <g stroke="#090C18" stroke-width="3">
    <path d="M97 276 L97 250"/><path d="M201 264 L201 232"/><path d="M278 284 L278 262"/>
  </g>
  <!-- warm rim on the sun-facing edges -->
  <g fill="#FF9A2E" opacity=".55">
    <rect x="106" y="276" width="2" height="146"/><rect x="212" y="264" width="2" height="158"/>
    <rect x="286" y="284" width="2" height="138"/><rect x="342" y="300" width="2" height="122"/>
  </g>
  <!-- lit windows -->
  <g fill="#FFD23F" opacity=".9">
    <rect x="38" y="314" width="3.5" height="5"/><rect x="44" y="330" width="3.5" height="5"/>
    <rect x="92" y="290" width="3.5" height="5"/><rect x="99" y="308" width="3.5" height="5"/>
    <rect x="94" y="340" width="3.5" height="5"/><rect x="138" y="302" width="3.5" height="5"/>
    <rect x="149" y="320" width="3.5" height="5"/><rect x="194" y="278" width="3.5" height="5"/>
    <rect x="204" y="298" width="3.5" height="5"/><rect x="196" y="336" width="3.5" height="5"/>
    <rect x="273" y="298" width="3.5" height="5"/><rect x="280" y="328" width="3.5" height="5"/>
    <rect x="329" y="316" width="3.5" height="5"/><rect x="336" y="342" width="3.5" height="5"/>
    <rect x="60"  y="358" width="3.5" height="5"/><rect x="300" y="340" width="3.5" height="5"/>
  </g>
</g>
<rect x="0" y="398" width="400" height="30" fill="#FF7A1A" opacity=".22" filter="url(#ms)"/>

<!-- ── sea ── -->
<rect x="0" y="422" width="400" height="198" fill="url(#water)"/>
<!-- sun path on the water -->
<g fill="#FFC745" opacity=".34">
  <rect x="282" y="430" width="20" height="3" rx="1.5"/>
  <rect x="276" y="446" width="32" height="3" rx="1.5"/>
  <rect x="268" y="464" width="46" height="3.5" rx="1.75"/>
  <rect x="258" y="486" width="64" height="3.5" rx="1.75"/>
  <rect x="246" y="512" width="86" height="4" rx="2"/>
  <rect x="232" y="544" width="112" height="4" rx="2"/>
  <rect x="216" y="582" width="142" height="4.5" rx="2.25"/>
</g>
<!-- swell, drawn as long low ellipses so the water has body -->
<g opacity=".5">
  <ellipse cx="70"  cy="452" rx="86"  ry="4" fill="#4A5D86"/>
  <ellipse cx="320" cy="470" rx="94"  ry="4.5" fill="#3E5077"/>
  <ellipse cx="140" cy="502" rx="120" ry="5" fill="#33456B"/>
  <ellipse cx="300" cy="548" rx="130" ry="6" fill="#2A3A5D"/>
  <ellipse cx="110" cy="596" rx="150" ry="7" fill="#22314F"/>
</g>

<!-- ── the submarine ── -->
<g transform="translate(172 520)">
  <!-- disturbed water it sits in -->
  <ellipse cx="0" cy="30" rx="176" ry="22" fill="#081733" opacity=".9"/>
  <ellipse cx="0" cy="24" rx="152" ry="14" fill="#5FD0FF" opacity=".16"/>
  <!-- hull -->
  <path d="M-150 16 C-112 -18 112 -18 150 16 C108 36 -108 36 -150 16Z" fill="url(#subHull)"/>
  <!-- waterline foam -->
  <path d="M-150 16 C-108 34 108 34 150 16" fill="none" stroke="#BFE4FF" stroke-width="3" opacity=".45"/>
  <!-- top deck catching the sun -->
  <path d="M-150 16 C-112 -18 112 -18 150 16 C112 -6 -112 -6 -150 16Z" fill="#9BA3B4" opacity=".5"/>
  <path d="M-118 2 C-80 -14 90 -14 126 4" fill="none" stroke="#FFC745" stroke-width="2.6" opacity=".65"/>
  <!-- sail -->
  <path d="M-30 -4 L-22 -64 L22 -64 L30 -4Z" fill="url(#sailGrad)"/>
  <path d="M-22 -64 L22 -64 L21 -58 L-21 -58Z" fill="#B7BDCA" opacity=".7"/>
  <path d="M22 -64 L30 -4" stroke="#FFC745" stroke-width="2.4" opacity=".7" fill="none"/>
  <!-- masts -->
  <g stroke="#C2C8D6" stroke-width="3.4" stroke-linecap="round">
    <path d="M-8 -64 L-8 -98"/><path d="M8 -64 L8 -84"/>
  </g>
  <circle cx="-8" cy="-100" r="3.4" fill="#FF3B30"/>
  <!-- red star on the sail -->
  <g transform="translate(0 -38) scale(.4)">
    <path d="M0 -30 L8.8 -9.3 31.5 -9.3 13.2 3.6 20.1 25.2 0 12 -20.1 25.2 -13.2 3.6 -31.5 -9.3 -8.8 -9.3Z"
          fill="#E01020" stroke="#FFD23F" stroke-width="2.5"/>
  </g>
  <!-- open missile hatch, aft -->
  <ellipse cx="74" cy="2" rx="23" ry="8" fill="#04070E"/>
  <ellipse cx="74" cy="2" rx="23" ry="8" fill="none" stroke="#98A0B0" stroke-width="2.2"/>
  <path d="M97 2 a23 8 0 0 1 -10 6" fill="none" stroke="#FFC745" stroke-width="2" opacity=".6"/>
  <!-- hull plating -->
  <g stroke="#0D1017" opacity=".45" stroke-width="1.6">
    <path d="M-104 4 L-104 26"/><path d="M-62 -2 L-62 30"/><path d="M110 4 L110 26"/>
  </g>
  <!-- bow wake -->
  <g filter="url(#spray)" opacity=".5">
    <ellipse cx="-150" cy="18" rx="34" ry="9" fill="#DCEBFF"/>
    <ellipse cx="152"  cy="18" rx="28" ry="8" fill="#DCEBFF"/>
  </g>
</g>

<!-- steam boiling out of the launch tube -->
<g filter="url(#spray)" opacity=".75">
  <ellipse cx="248" cy="500" rx="58" ry="28" fill="#D8E2F0" opacity=".35"/>
  <ellipse cx="252" cy="470" rx="40" ry="24" fill="#FFFFFF" opacity=".26"/>
  <ellipse cx="246" cy="440" rx="28" ry="18" fill="#FFE9B0" opacity=".2"/>
</g>

<!-- ── the missile ── -->
<g transform="translate(268 292) rotate(17)">
  <g transform="translate(0 60)">
    <path d="M-20 0 C-14 88 -6 150 0 198 C6 150 14 88 20 0Z" fill="url(#msFlame)" opacity=".95"/>
    <path d="M-10 0 C-7 64 -3 106 0 134 C3 106 7 64 10 0Z" fill="#FFF6C2" opacity=".95"/>
    <path d="M-4.4 0 C-3 44 -1.4 70 0 90 C1.4 70 3 44 4.4 0Z" fill="#FFFFFF"/>
  </g>
  <path d="M-16 18 L-38 74 L-16 64Z" fill="#A50E16"/>
  <path d="M16 18 L38 74 L16 64Z"    fill="#6E0810"/>
  <rect x="-16" y="-70" width="32" height="130" rx="5" fill="url(#msBody)"/>
  <path d="M-16 -70 C-16 -108 -6 -136 0 -148 C6 -136 16 -108 16 -70Z" fill="#D81420"/>
  <path d="M-16 -70 C-16 -108 -6 -136 0 -148" fill="none" stroke="#FF8A8A" stroke-width="2" opacity=".6"/>
  <rect x="-16" y="-40" width="32" height="7" fill="#D81420" opacity=".92"/>
  <rect x="-16" y="14"  width="32" height="5" fill="#262B34" opacity=".7"/>
  <rect x="-9" y="-64" width="4.5" height="120" rx="2.25" fill="#FFFFFF" opacity=".6"/>
</g>

<!-- targeting reticle over the skyline -->
<g stroke="#39FF88" stroke-width="2.2" fill="none" opacity=".8" filter="url(#mg)">
  <circle cx="106" cy="306" r="25"/>
  <path d="M106 272 L106 290 M106 322 L106 340 M72 306 L90 306 M122 306 L140 306"/>
</g>

<rect width="400" height="620" filter="url(#grain2)" opacity=".05" style="mix-blend-mode:overlay"/>
<rect x="3" y="3" width="394" height="614" fill="none" stroke="#FFC745" stroke-width="2.5" opacity=".45"/>
</svg>
