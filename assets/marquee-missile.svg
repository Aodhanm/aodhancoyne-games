<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-label="Marquee: the Korean title of the missile game, with a launching missile and a red star">
<defs>
  <linearGradient id="mmbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#0A0713"/>
    <stop offset=".38" stop-color="#201038"/>
    <stop offset=".68" stop-color="#7A1236"/>
    <stop offset=".88" stop-color="#D4391C"/>
    <stop offset="1"   stop-color="#F5952A"/>
  </linearGradient>
  <linearGradient id="mmletter" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#FFFBE6"/>
    <stop offset=".3"  stop-color="#FFD84E"/>
    <stop offset=".6"  stop-color="#F0A81C"/>
    <stop offset=".76" stop-color="#FFE9A0"/>
    <stop offset="1"   stop-color="#C4770A"/>
  </linearGradient>
  <linearGradient id="mmray" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFD84E" stop-opacity=".5"/>
    <stop offset="1" stop-color="#FFD84E" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="mmrocket" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#4E5462"/>
    <stop offset=".26" stop-color="#D2D8E4"/>
    <stop offset=".55" stop-color="#FFFFFF"/>
    <stop offset=".8"  stop-color="#9AA1B0"/>
    <stop offset="1"   stop-color="#333944"/>
  </linearGradient>
  <linearGradient id="mmflame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#FFFFFF"/>
    <stop offset=".28" stop-color="#FFF0A8"/>
    <stop offset=".62" stop-color="#FFA51C"/>
    <stop offset="1"   stop-color="#FF4A10" stop-opacity="0"/>
  </linearGradient>
  <filter id="mmglow" x="-40%" y="-60%" width="180%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="mmsoft" x="-60%" y="-80%" width="220%" height="260%">
    <feGaussianBlur stdDeviation="13"/>
  </filter>
</defs>

<rect width="760" height="150" fill="url(#mmbg)"/>

<!-- sunburst from the lower right, the standard poster device -->
<g opacity=".6">
  <path d="M760 150 L630 0  L588 14Z" fill="url(#mmray)"/>
  <path d="M760 150 L520 0  L478 18Z" fill="url(#mmray)" opacity=".72"/>
  <path d="M760 150 L400 8  L358 30Z" fill="url(#mmray)" opacity=".5"/>
  <path d="M760 150 L250 20 L208 44Z" fill="url(#mmray)" opacity=".34"/>
</g>
<ellipse cx="650" cy="150" rx="230" ry="100" fill="#FF8A1E" opacity=".2" filter="url(#mmsoft)"/>

<!-- stars, left -->
<g fill="#FFFFFF" opacity=".85">
  <circle cx="44" cy="24" r="1.7"/><circle cx="98" cy="58" r="1.1"/>
  <circle cx="150" cy="20" r="1.4"/><circle cx="70" cy="94" r="1"/>
</g>

<!-- small skyline along the base, sun-struck -->
<g fill="#12081A" opacity=".85">
  <rect x="0"   y="118" width="22" height="32"/><rect x="26" y="106" width="16" height="44"/>
  <rect x="46"  y="124" width="24" height="26"/><rect x="74" y="98"  width="18" height="52"/>
  <rect x="96"  y="116" width="14" height="34"/><rect x="114" y="104" width="22" height="46"/>
  <rect x="640" y="112" width="20" height="38"/><rect x="664" y="98" width="16" height="52"/>
  <rect x="684" y="120" width="24" height="30"/><rect x="712" y="104" width="18" height="46"/>
  <rect x="734" y="116" width="26" height="34"/>
</g>
<g fill="#FFD84E" opacity=".7">
  <rect x="32" y="114" width="3" height="4"/><rect x="80" y="108" width="3" height="4"/>
  <rect x="120" y="114" width="3" height="4"/><rect x="670" y="108" width="3" height="4"/>
  <rect x="718" y="114" width="3" height="4"/>
</g>

<!-- the missile, climbing out of the left -->
<g transform="translate(104 78) rotate(22) scale(.62)">
  <g transform="translate(0 58)">
    <path d="M-20 0 C-14 74 -6 122 0 158 C6 122 14 74 20 0Z" fill="url(#mmflame)" opacity=".95"/>
    <path d="M-9 0 C-6 52 -3 84 0 106 C3 84 6 52 9 0Z" fill="#FFF6C2"/>
  </g>
  <path d="M-16 16 L-38 70 L-16 60Z" fill="#A50E16"/>
  <path d="M16 16 L38 70 L16 60Z"    fill="#6E0810"/>
  <rect x="-16" y="-68" width="32" height="126" rx="5" fill="url(#mmrocket)"/>
  <path d="M-16 -68 C-16 -104 -6 -132 0 -144 C6 -132 16 -104 16 -68Z" fill="#E01020"/>
  <rect x="-16" y="-38" width="32" height="7" fill="#D81420" opacity=".9"/>
  <rect x="-9" y="-62" width="4.5" height="116" rx="2.25" fill="#FFFFFF" opacity=".6"/>
</g>

<!-- red star, right -->
<g transform="translate(676 66) scale(1.35)" filter="url(#mmglow)">
  <path d="M0 -30 L8.8 -9.3 31.5 -9.3 13.2 3.6 20.1 25.2 0 12 -20.1 25.2 -13.2 3.6 -31.5 -9.3 -8.8 -9.3Z"
        fill="#E8121E" stroke="#FFD84E" stroke-width="2.6" stroke-linejoin="round"/>
</g>

<!-- ── Korean title, set large with a printed drop shadow ── -->
<g transform="translate(380 66)" text-anchor="middle">
  <text x="4" y="6" font-family="'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="46" font-weight="800" letter-spacing="2"
        fill="#5A0A12" opacity=".9">조선인민 미사일</text>
  <text x="0" y="0" font-family="'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="46" font-weight="800" letter-spacing="2"
        fill="url(#mmletter)" stroke="#7A1010" stroke-width="2" paint-order="stroke">조선인민 미사일</text>
</g>
<g transform="translate(380 100)" text-anchor="middle">
  <text font-family="'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="21" font-weight="700" letter-spacing="6"
        fill="#FFE9A8" opacity=".95">자위 모의훈련</text>
</g>

<!-- latin line on a rule -->
<g transform="translate(212 132)">
  <path d="M0 0 h336" stroke="#FFD84E" stroke-width="1.5" opacity=".5"/>
  <text x="168" y="-6" text-anchor="middle"
        font-family="Futura,'Avenir Next',Helvetica,Arial,sans-serif"
        font-size="10.5" letter-spacing="3.6" fill="#FFC04A" opacity=".85">MISSILE SELF-DEFENCE SIMULATOR</text>
</g>

<rect x="1.5" y="1.5" width="757" height="147" fill="none" stroke="#FFD84E" stroke-width="3" opacity=".45"/>
</svg>
