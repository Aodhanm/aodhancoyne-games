<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-label="Marquee: 조선인민 미사일 자위 모의훈련, with the national flag, a radar sweep and a missile on a long contrail">
<defs>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#060B18"/><stop offset=".42" stop-color="#0D1A36"/>
    <stop offset=".78" stop-color="#11284E"/>
    <stop offset="1" stop-color="#081428"/>
  </linearGradient>
  <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".52" stop-color="#F0F4FA"/>
    <stop offset=".68" stop-color="#C3CCDC"/><stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
  <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#7FB2FF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#CFE2FF" stop-opacity=".5"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".95"/>
  </linearGradient>
  <linearGradient id="mrBody" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3C424F"/>
    <stop offset=".26" stop-color="#C6CDDA"/><stop offset=".54" stop-color="#FFFFFF"/>
    <stop offset=".82" stop-color="#8D95A5"/><stop offset="1" stop-color="#292E38"/>
  </linearGradient>
  <linearGradient id="mrFlame" x1="1" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#FF4A10" stop-opacity="0"/><stop offset=".4" stop-color="#FFA51C"/>
    <stop offset=".82" stop-color="#FFF0A8"/><stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
  <radialGradient id="sweep" cx=".5" cy="1" r="1">
    <stop offset=".55" stop-color="#39FF88" stop-opacity="0"/>
    <stop offset=".92" stop-color="#39FF88" stop-opacity=".30"/>
    <stop offset="1" stop-color="#39FF88" stop-opacity="0"/>
  </radialGradient>
  <filter id="mmglow" x="-50%" y="-70%" width="200%" height="240%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="mmsoft" x="-60%" y="-80%" width="220%" height="260%"><feGaussianBlur stdDeviation="13"/></filter>
</defs>

<rect width="760" height="190" fill="#081428"/>
<rect width="760" height="190" fill="url(#steel)"/>

<!-- radar: concentric range rings and a sweep, left side -->
<g transform="translate(118 196)" opacity=".7">
  <g fill="none" stroke="#39FF88" stroke-width="1.5">
    <circle r="52"/><circle r="88"/><circle r="124"/><circle r="160"/>
  </g>
  <g stroke="#39FF88" stroke-width="1.3" opacity=".55">
    <path d="M-160 0 L160 0"/><path d="M-113 -113 L113 113"/><path d="M113 -113 L-113 113"/>
  </g>
  <path d="M0 0 L-150 -56 A160 160 0 0 1 -56 -150Z" fill="url(#sweep)"/>
  <g fill="#39FF88" opacity=".8">
    <circle cx="-64" cy="-92" r="2.6"/><circle cx="-116" cy="-46" r="2"/><circle cx="-30" cy="-130" r="2.2"/>
  </g>
</g>

<!-- horizon and sea, low band -->
<rect x="0" y="158" width="760" height="32" fill="#04101F"/>
<path d="M0 158 H760" stroke="#1E4E7A" stroke-width="1.6" opacity=".7"/>
<g fill="#2A6FA8" opacity=".4">
  <rect x="60" y="168" width="90" height="2.4" rx="1.2"/>
  <rect x="300" y="176" width="120" height="2.4" rx="1.2"/>
  <rect x="560" y="166" width="86" height="2.4" rx="1.2"/>
</g>

<!-- the long contrail, sweeping from the sea up to the right -->
<path d="M-10 186 C160 172 340 130 700 22" fill="none" stroke="url(#trail)" stroke-width="22"
      stroke-linecap="round" opacity=".22" filter="url(#mmsoft)"/>
<path d="M-10 184 C160 170 340 128 700 20" fill="none" stroke="url(#trail)" stroke-width="4"
      stroke-linecap="round" opacity=".9"/>

<!-- the missile, upper right, whole body visible -->
<g transform="translate(676 52) rotate(42) scale(.56)">
  <g transform="translate(0 54)">
    <path d="M-19 0 C-13 74 -5 122 0 158 C5 122 13 74 19 0Z" fill="url(#mrFlame)" opacity=".92"/>
    <path d="M-9 0 C-6 52 -3 84 0 106 C3 84 6 52 9 0Z" fill="#FFF6C2"/>
  </g>
  <path d="M-15 14 L-36 66 L-15 56Z" fill="#B4121A"/>
  <path d="M15 14 L36 66 L15 56Z"    fill="#79090F"/>
  <rect x="-15" y="-64" width="30" height="118" rx="4.5" fill="url(#mrBody)"/>
  <path d="M-15 -64 C-15 -98 -6 -126 0 -138 C6 -126 15 -98 15 -64Z" fill="#ED1C27"/>
  <rect x="-15" y="-34" width="30" height="6.5" fill="#ED1C27" opacity=".9"/>
  <rect x="-8.5" y="-58" width="4" height="108" rx="2" fill="#FFFFFF" opacity=".6"/>
</g>

<!-- ── the flag, drawn properly, hung at the left on a staff ── -->
<g transform="translate(44 44)">
  <path d="M-8 -8 L-8 146" stroke="#8E96A6" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="-8" cy="-12" r="4" fill="#D6DCE8"/>
  <g>
    <!-- 1:2 field: blue, white fimbriation, red centre, white disc, red star -->
    <rect x="0" y="0" width="132" height="66" fill="#024FA2"/>
    <rect x="0" y="9.9" width="132" height="46.2" fill="#F7F7F7"/>
    <rect x="0" y="13.2" width="132" height="39.6" fill="#ED1C27"/>
    <circle cx="42" cy="33" r="14.5" fill="#F7F7F7"/>
    <g transform="translate(42 33) scale(.4)">
      <path d="M0 -30 L8.8 -9.3 31.5 -9.3 13.2 3.6 20.1 25.2 0 12 -20.1 25.2 -13.2 3.6 -31.5 -9.3 -8.8 -9.3Z" fill="#ED1C27"/>
    </g>
    <rect x="0" y="0" width="132" height="66" fill="none" stroke="#0A1424" stroke-width="1.4" opacity=".6"/>
    <!-- a little wave in the cloth -->
    <path d="M0 0 h132 v66 h-132Z" fill="url(#trail)" opacity=".06"/>
  </g>
</g>

<!-- ── title, right of the flag, white on a red keyline ── -->
<g transform="translate(202 62)">
  <rect x="-14" y="-26" width="5" height="92" fill="#ED1C27"/>
  <text x="4" y="4" font-family="'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="46" font-weight="800" letter-spacing="1" fill="#05101F" opacity=".9">조선인민 미사일</text>
  <text x="0" y="0" font-family="'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="46" font-weight="800" letter-spacing="1"
        fill="url(#titleFill)" stroke="#0A1424" stroke-width="1.8" paint-order="stroke">조선인민 미사일</text>
  <text x="4" y="36" font-family="'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="21" font-weight="700" letter-spacing="7" fill="#ED1C27">자위 모의훈련</text>
  <text x="6" y="62" font-family="Futura,'Avenir Next',Helvetica,Arial,sans-serif"
        font-size="10" letter-spacing="3.4" fill="#8FB4D8" opacity=".9">MISSILE SELF-DEFENCE SIMULATOR</text>
</g>

<text x="16" y="184" font-family="Helvetica,Arial,sans-serif" font-size="7"
      letter-spacing=".8" fill="#5C7A9E" opacity=".8">AODHAN COYNE · MMXXVI</text>
</svg>
