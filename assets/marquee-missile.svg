<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-label="Marquee: the Korean title of the missile game over a launch plume, with the national flag bands">
<defs>
  <linearGradient id="mmbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0"   stop-color="#0B0A18"/>
    <stop offset=".34" stop-color="#141B3C"/>
    <stop offset=".62" stop-color="#2B2350"/>
    <stop offset=".84" stop-color="#5C1A44"/>
    <stop offset="1"   stop-color="#8E1A30"/>
  </linearGradient>
  <linearGradient id="mmletter" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#FFFFFF"/>
    <stop offset=".34" stop-color="#FFF1F1"/>
    <stop offset=".62" stop-color="#FFD3D3"/>
    <stop offset="1"   stop-color="#E7A0A0"/>
  </linearGradient>
  <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0"   stop-color="#FF5A14" stop-opacity="0"/>
    <stop offset=".45" stop-color="#FFA51C" stop-opacity=".55"/>
    <stop offset="1"   stop-color="#FFF3B0" stop-opacity=".9"/>
  </linearGradient>
  <linearGradient id="mmrocket" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#3F4653"/>
    <stop offset=".26" stop-color="#C9D0DC"/>
    <stop offset=".54" stop-color="#FFFFFF"/>
    <stop offset=".82" stop-color="#8F97A6"/>
    <stop offset="1"   stop-color="#2B303A"/>
  </linearGradient>
  <linearGradient id="mmflame" x1="1" y1="1" x2="0" y2="0">
    <stop offset="0"   stop-color="#FF4A10" stop-opacity="0"/>
    <stop offset=".4"  stop-color="#FFA51C"/>
    <stop offset=".8"  stop-color="#FFF0A8"/>
    <stop offset="1"   stop-color="#FFFFFF"/>
  </linearGradient>
  <filter id="mmglow" x="-50%" y="-70%" width="200%" height="240%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="mmsoft" x="-60%" y="-80%" width="220%" height="260%"><feGaussianBlur stdDeviation="15"/></filter>
</defs>

<rect width="760" height="150" fill="url(#mmbg)"/>

<!-- searchlight beams raking the night sky -->
<g opacity=".3">
  <path d="M120 150 L26 0 L62 0Z"   fill="#BFD8FF"/>
  <path d="M210 150 L188 0 L226 0Z" fill="#BFD8FF" opacity=".8"/>
  <path d="M318 150 L392 0 L428 0Z" fill="#BFD8FF" opacity=".6"/>
</g>

<!-- the launch arc: a long trail sweeping up to the right -->
<path d="M-20 168 C140 150 300 96 560 8" fill="none" stroke="url(#arc)" stroke-width="26"
      stroke-linecap="round" opacity=".3" filter="url(#mmsoft)"/>
<path d="M-20 166 C140 148 300 94 560 6" fill="none" stroke="url(#arc)" stroke-width="5"
      stroke-linecap="round" opacity=".85"/>

<!-- sea and a low skyline right across the base -->
<rect x="0" y="128" width="760" height="22" fill="#060A18"/>
<g fill="#0A1024">
  <rect x="18"  y="112" width="18" height="18"/><rect x="42" y="104" width="14" height="26"/>
  <rect x="62"  y="118" width="20" height="12"/><rect x="96" y="100" width="16" height="30"/>
  <rect x="118" y="114" width="12" height="16"/><rect x="620" y="106" width="16" height="24"/>
  <rect x="642" y="116" width="20" height="14"/><rect x="668" y="98" width="14" height="32"/>
  <rect x="688" y="112" width="18" height="18"/><rect x="712" y="104" width="16" height="26"/>
  <rect x="734" y="118" width="22" height="12"/>
</g>
<g fill="#FFD23F" opacity=".6">
  <rect x="47" y="112" width="3" height="4"/><rect x="101" y="108" width="3" height="4"/>
  <rect x="673" y="106" width="3" height="4"/><rect x="717" y="112" width="3" height="4"/>
</g>
<!-- water shimmer -->
<g fill="#4C7FC4" opacity=".35">
  <rect x="150" y="136" width="90" height="2.5" rx="1.25"/>
  <rect x="330" y="142" width="130" height="2.5" rx="1.25"/>
  <rect x="520" y="134" width="80" height="2.5" rx="1.25"/>
</g>

<!-- the missile, leaving frame top right -->
<g transform="translate(596 52) rotate(38) scale(.58)">
  <g transform="translate(0 56)">
    <path d="M-20 0 C-14 78 -6 128 0 166 C6 128 14 78 20 0Z" fill="url(#mmflame)" opacity=".9"/>
    <path d="M-9 0 C-6 54 -3 88 0 110 C3 88 6 54 9 0Z" fill="#FFF6C2"/>
  </g>
  <path d="M-16 14 L-38 68 L-16 58Z" fill="#B4121A"/>
  <path d="M16 14 L38 68 L16 58Z"    fill="#79090F"/>
  <rect x="-16" y="-66" width="32" height="122" rx="5" fill="url(#mmrocket)"/>
  <path d="M-16 -66 C-16 -102 -6 -130 0 -142 C6 -130 16 -102 16 -66Z" fill="#D4152A"/>
  <rect x="-16" y="-36" width="32" height="7" fill="#D4152A" opacity=".9"/>
  <rect x="-9" y="-60" width="4.5" height="112" rx="2.25" fill="#FFFFFF" opacity=".6"/>
</g>

<!-- national flag bands, top and bottom, in place of any star -->
<g>
  <rect x="0" y="0"   width="760" height="5"   fill="#0E4A9C"/>
  <rect x="0" y="5"   width="760" height="2.5" fill="#F2F4F8"/>
  <rect x="0" y="7.5" width="760" height="7"   fill="#D4152A"/>
  <rect x="0" y="143" width="760" height="7"   fill="#D4152A"/>
  <rect x="0" y="140.5" width="760" height="2.5" fill="#F2F4F8"/>
  <rect x="0" y="135.5" width="760" height="5" fill="#0E4A9C"/>
</g>

<!-- ── title, left-aligned and stacked, with a red keyline block behind ── -->
<g transform="translate(56 40)">
  <rect x="-14" y="-24" width="4" height="86" fill="#D4152A"/>
  <text x="8" y="12"
        font-family="'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="44" font-weight="800" letter-spacing="1"
        fill="#3A0208" opacity=".85">조선인민 미사일</text>
  <text x="4" y="8"
        font-family="'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="44" font-weight="800" letter-spacing="1"
        fill="url(#mmletter)" stroke="#8E0A16" stroke-width="1.8" paint-order="stroke">조선인민 미사일</text>
  <text x="6" y="44"
        font-family="'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="20" font-weight="700" letter-spacing="7"
        fill="#FFD3D3" opacity=".95">자위 모의훈련</text>
  <text x="8" y="70"
        font-family="Futura,'Avenir Next',Helvetica,Arial,sans-serif"
        font-size="10" letter-spacing="3.4" fill="#FF9BA6" opacity=".8">MISSILE SELF-DEFENCE SIMULATOR</text>
</g>
</svg>
