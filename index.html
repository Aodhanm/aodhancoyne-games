<style>
 :root{
  --void:#07060D; --room:#0D0A18; --wall:#140F24; --wall-lo:#0A0713;
  --ink:#EDE9FB; --dim:#9A93B8; --faint:#645C85;
  --neon-c:#00E5FF; --neon-m:#FF2D95; --neon-y:#FFD23F; --neon-g:#39FF88;
  --cab-body:#171226; --cab-edge:#241B3C; --cab-dark:#0B0815;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --disp:"Futura","Avenir Next Condensed","Helvetica Neue",Impact,sans-serif;
 }
 *{box-sizing:border-box}
 html,body{margin:0;height:100%}
 body{
  background:var(--void); color:var(--dim);
  font-family:var(--mono); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
 }
 .skip{position:absolute;left:-9999px}
 .skip:focus{left:10px;top:10px;background:var(--neon-c);color:#000;padding:8px 14px;z-index:99;border-radius:3px}

 /* ───────────────────────── the room ───────────────────────── */
 .room{
  position:relative; min-height:100vh; overflow:hidden;
  background:
   radial-gradient(120% 70% at 50% 0%, #1B1433 0%, #0C0917 55%, var(--void) 100%);
 }
 /* ceiling haze + neon spill */
 .room::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
   radial-gradient(50% 34% at 18% 8%, rgba(255,45,149,.20), transparent 70%),
   radial-gradient(50% 34% at 82% 6%, rgba(0,229,255,.18), transparent 70%),
   radial-gradient(70% 40% at 50% 100%, rgba(255,210,63,.07), transparent 70%);
 }

 /* ── carpet: classic neon arcade pattern, laid in perspective ── */
 .floor{
  position:absolute; left:-35%; right:-35%; bottom:0; height:54vh; z-index:0;
  perspective:640px; perspective-origin:50% 0%;
 }
 .carpet{
  position:absolute; inset:0; transform:rotateX(66deg); transform-origin:50% 0%;
  background-color:#0B0A20;
  background-image:
   radial-gradient(circle at 12% 22%, var(--neon-m) 0 3px, transparent 3.5px),
   radial-gradient(circle at 62% 72%, var(--neon-c) 0 3px, transparent 3.5px),
   radial-gradient(circle at 86% 32%, var(--neon-y) 0 2.5px, transparent 3px),
   radial-gradient(circle at 36% 88%, var(--neon-g) 0 2.5px, transparent 3px),
   linear-gradient(56deg, transparent 46%, rgba(0,229,255,.30) 46% 50%, transparent 50%),
   linear-gradient(-56deg, transparent 46%, rgba(255,45,149,.28) 46% 50%, transparent 50%),
   linear-gradient(0deg, transparent 47%, rgba(255,210,63,.16) 47% 49%, transparent 49%);
  background-size:120px 120px,120px 120px,120px 120px,120px 120px,96px 96px,96px 96px,60px 60px;
  box-shadow:inset 0 60px 90px -30px rgba(0,0,0,.85);
 }
 .floor::after{ /* fog the horizon so the tiling never reads as wallpaper */
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, var(--void) 0%, rgba(7,6,13,.72) 16%, transparent 60%);
 }

 /* ───────────────────────── masthead ───────────────────────── */
 header{position:relative;z-index:3;text-align:center;padding:40px 22px 0}
 .back{
  position:absolute;left:22px;top:22px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;
 }
 .back:hover,.back:focus-visible{color:var(--neon-c);border-bottom-color:var(--neon-c);outline:0}

 .sign{
  display:inline-block;padding:14px 34px 16px;border:2px solid rgba(0,229,255,.5);border-radius:6px;
  background:rgba(10,7,20,.55);
 }
 h1{
  margin:0;font-family:var(--disp);font-size:clamp(2.2rem,7vw,3.9rem);font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;color:#FFF;line-height:1;
  text-shadow:
   0 0 6px #fff, 0 0 16px var(--neon-c), 0 0 34px var(--neon-c),
   0 0 62px rgba(0,229,255,.55);
  animation:flick 7s infinite steps(1);
 }
 @keyframes flick{
  0%,97%,100%{opacity:1}
  97.5%{opacity:.55} 98%{opacity:1} 98.6%{opacity:.42} 99.1%{opacity:1}
 }
 .tag{
  margin:11px 0 0;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--neon-m);
  text-shadow:0 0 8px rgba(255,45,149,.75);
 }
 @media(prefers-reduced-motion:reduce){ h1{animation:none} }

 /* ───────────────────────── cabinets ───────────────────────── */
 .hall{
  position:relative;z-index:3;
  display:flex;justify-content:center;align-items:flex-end;gap:clamp(28px,9vw,150px);
  flex-wrap:wrap; padding:40px 22px 0; max-width:1460px; margin:0 auto;
 }
 .cab{
  --hue:var(--neon-c);
  --tmold:#E6E9F2;               /* the plastic trim colour, per cabinet */
  position:relative; width:min(376px,90vw); flex:0 1 376px;
  display:flex; flex-direction:column; align-items:stretch;
  filter:drop-shadow(0 34px 34px rgba(0,0,0,.72));
 }
 /* T-molding: the trim capping the leading plywood edges, full height */
 .cab::before{
  content:"";position:absolute;left:-5px;right:-5px;top:26px;bottom:0;z-index:0;
  border-left:5px solid var(--tmold);border-right:5px solid var(--tmold);
  border-radius:4px;
  box-shadow:inset 2px 0 3px -1px rgba(0,0,0,.55), inset -2px 0 3px -1px rgba(0,0,0,.55);
  opacity:.92;
 }
 .cab > *{position:relative;z-index:1}
 .cab.left{transform:rotateY(7deg)}
 .cab.right{transform:rotateY(-7deg)}
 /* hover: the machine steps forward and its marquee lifts */
 .cab{transition:transform .3s cubic-bezier(.2,.7,.3,1), filter .3s ease}
 .cab.lit.left {transform:rotateY(5deg)  scale(1.07) translateY(-10px)}
 .cab.lit.right{transform:rotateY(-5deg) scale(1.07) translateY(-10px)}
 .cab.lit{filter:drop-shadow(0 40px 40px rgba(0,0,0,.8)) drop-shadow(0 0 44px var(--hue))}
 .cab.lit .marquee{box-shadow:0 8px 14px -6px rgba(0,0,0,.9), 0 0 58px -6px var(--hue)}
 .cab.lit .screen{box-shadow:inset 0 0 44px rgba(0,0,0,.9), inset 0 0 90px -22px var(--hue), 0 0 30px -8px var(--hue)}
 .cab.lit::after{opacity:.42}
 @media(prefers-reduced-motion:reduce){ .cab{transition:none} .cab.lit.left,.cab.lit.right{transform:none} }
 @media(max-width:900px){ .cab.left,.cab.right{transform:none} }

 /* ── marquee: backlit plastic in a housing that overhangs the cabinet face ── */
 .marquee{
  position:relative; margin:0 -10px; padding:4px 4px 5px;
  background:linear-gradient(180deg,#0E0B18 0%,#181327 42%,#0A0713 100%);
  border:1px solid #2A2142; border-radius:4px 4px 2px 2px;
  box-shadow:0 8px 14px -6px rgba(0,0,0,.9), 0 0 30px -10px var(--hue);
 }
 .marquee .glass{
  position:relative; overflow:hidden; border-radius:2px; padding:0; text-align:center;
  line-height:0;
  background:
   linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.03) 26%, rgba(0,0,0,.28) 100%),
   linear-gradient(180deg,#2E2348,#1A1330);
  box-shadow:inset 0 0 34px -6px var(--hue), inset 0 0 0 1px rgba(255,255,255,.07);
 }
 /* the fluorescent tube behind the plastic */
 .marquee .glass::before{
  content:"";position:absolute;left:8%;right:8%;top:-14px;height:26px;border-radius:50%;
  background:var(--hue);opacity:.28;filter:blur(11px);pointer-events:none;
 }
 .marquee .glass img{display:block;width:100%;height:auto}
 .marquee b{
  position:relative;display:block;
  font-family:var(--disp);font-size:clamp(1.15rem,3.4vw,1.72rem);font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:#fff;line-height:1.05;
  text-shadow:0 0 5px #fff,0 0 15px var(--hue),0 0 34px var(--hue);
 }
 .marquee i{
  position:relative;display:block;font-style:normal;margin-top:5px;
  font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--hue);opacity:.95;
 }

 /* ── bezel: the monitor sits recessed behind printed card ── */
 .bezel{
  position:relative;
  background:
   radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.05), transparent 60%),
   linear-gradient(180deg,#141021,#0B0814);
  border-left:1px solid var(--cab-edge); border-right:1px solid var(--cab-edge);
  padding:20px 20px 18px;
 }
 /* shadow the marquee housing casts down onto the bezel */
 .bezel::before{
  content:"";position:absolute;left:0;right:0;top:0;height:22px;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);
 }
 /* a thin printed stripe along the bezel, like screened cabinet art */
 .bezel::after{
  content:"";position:absolute;left:20px;right:20px;bottom:7px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--hue),transparent);opacity:.5;
 }
 .screen{
  position:relative; aspect-ratio:4/3; overflow:hidden; border-radius:11px/16px;
  background:#000; border:2px solid #05040A;
  box-shadow:inset 0 0 44px rgba(0,0,0,.95), inset 0 0 90px -30px var(--hue);
 }
 .screen img{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;object-fit:cover}
 /* attract reel: frames stacked, only the current one shown */
 .screen .reel img{opacity:0;transition:opacity .55s ease}
 .screen .reel img.on{opacity:1}
 .cab.playing .reel{display:none}
 /* The games expect a desktop-sized viewport. Give the iframe a full logical
    resolution and scale the whole thing down to fit the cabinet glass, rather
    than handing the game a tiny viewport it will crop. */
 .screen iframe{
  position:absolute;top:0;left:0;border:0;display:block;
  width:var(--vw,960px);height:var(--vh,720px);
  transform:scale(var(--fit,1));transform-origin:0 0;
 }
 /* scanlines + glass curve */
 .screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:
   repeating-linear-gradient(180deg, rgba(0,0,0,.32) 0 1px, transparent 1px 3px),
   radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
 }
 .cab.playing .screen::after{opacity:.45}

 /* insert coin overlay */
 /* the glass itself is the button; the prompt sits low and small, out of the picture */
 .coin{
  position:absolute;inset:0;z-index:5;display:grid;align-content:end;justify-content:center;
  padding-bottom:12px;
  background:linear-gradient(180deg, transparent 0%, transparent 62%, rgba(4,3,10,.55) 100%);
  cursor:pointer;border:0;width:100%;font:inherit;color:inherit;text-align:center;
  transition:background .2s ease;
 }
 /* the text sits on its own plate so busy attract art can never swallow it */
 .coin b{
  display:block;padding:7px 15px 6px;border:1px solid var(--hue);border-radius:2px;
  background:rgba(4,3,10,.72);
  box-shadow:0 0 14px -6px var(--hue);
 }
 .coin span{
  display:block;
  font-family:var(--disp);font-size:clamp(.7rem,1.6vw,.86rem);font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:#fff;
  text-shadow:0 0 5px #fff,0 0 16px var(--hue),0 0 30px var(--hue);
  animation:blink 1.15s steps(1) infinite;
 }
 .coin small{display:none}
 @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.22}}
 @media(prefers-reduced-motion:reduce){ .coin span{animation:none} }
 .coin:hover,.coin:focus-visible{
  background:linear-gradient(180deg, transparent 0%, transparent 55%, rgba(4,3,10,.7) 100%);
  outline:0;
 }
 .coin:hover b,.coin:focus-visible b{box-shadow:0 0 32px -4px var(--hue), inset 0 0 30px -10px var(--hue)}
 .cab.playing .coin{display:none}

 /* ── control panel: juts forward of the cabinet face, sloped toward the player ── */
 .panel{
  position:relative; margin:0 -14px; z-index:2;
  background:
   linear-gradient(180deg, rgba(255,255,255,.10) 0 2px, transparent 2px),
   linear-gradient(180deg,#2A2044 0%,#1B1531 46%,#100C1E 100%);
  border:1px solid #2E2449;border-radius:3px 3px 5px 5px;
  padding:18px 22px 17px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  box-shadow:
   0 12px 20px -10px rgba(0,0,0,.95),
   inset 0 1px 0 rgba(255,255,255,.13),
   inset 0 -14px 22px -16px #000;
 }
 /* the front lip of the panel, seen because it overhangs */
 .panel::after{
  content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;
  background:linear-gradient(180deg,#0E0A1A,#06040C);
  border-left:1px solid #2E2449;border-right:1px solid #2E2449;border-radius:0 0 4px 4px;
 }
 /* ── KEDR: the Lunar Lander layout — a tall thrust lever, rotate buttons, abort ── */
 .lever{position:relative;width:34px;height:52px;flex:none}
 .lever .slot{
  position:absolute;left:50%;top:4px;width:7px;height:42px;margin-left:-3.5px;border-radius:4px;
  background:#05060A;box-shadow:inset 0 0 5px #000, 0 1px 0 rgba(255,255,255,.12);
 }
 .lever .arm{
  position:absolute;left:50%;top:8px;width:5px;height:30px;margin-left:-2.5px;border-radius:3px;
  background:linear-gradient(90deg,#4A5162,#A7AFC4,#4A5162);
 }
 .lever .grip{
  position:absolute;left:50%;top:0;width:23px;height:15px;margin-left:-11.5px;border-radius:5px;
  background:linear-gradient(180deg,#E9EDF5 0%,#AEB6C6 55%,#666E80 100%);
  box-shadow:0 2px 5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.7);
 }
 .lever i{
  position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);
  font-style:normal;font-size:7px;letter-spacing:.12em;color:var(--faint);white-space:nowrap;
 }
 .sqbtns{display:flex;gap:9px}
 .sqbtns i{
  width:26px;height:18px;border-radius:3px;display:block;position:relative;
  box-shadow:0 2px 0 rgba(0,0,0,.6), inset 0 -2px 4px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.45);
 }
 .sqbtns i.rot{background:linear-gradient(180deg,#E9EDF5,#9AA3B6)}
 .sqbtns i.abort{background:linear-gradient(180deg,#FF6B60,#B21208)}

 /* ── MISSILE: trackball and fire buttons ── */
 .ball{
  position:relative;width:54px;height:54px;flex:none;border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #FFFFFF 0 6%, #6FD3F5 26%, #1B7FA8 62%, #06334A 100%);
  box-shadow:
   inset 0 -6px 12px rgba(0,0,0,.55), inset 0 3px 8px rgba(255,255,255,.35),
   0 3px 8px rgba(0,0,0,.7), 0 0 20px -6px #2FC0EE;
 }
 /* the bezel the ball sits in */
 .ball::before{
  content:"";position:absolute;inset:-7px;border-radius:50%;
  background:radial-gradient(circle, transparent 58%, #0B0E16 60%);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.9);
 }
 .ball i{
  position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);
  font-style:normal;font-size:7px;letter-spacing:.12em;color:var(--faint);white-space:nowrap;
 }
 .fire{display:flex;gap:10px}
 .fire i{
  width:28px;height:28px;border-radius:5px;display:block;
  box-shadow:0 3px 0 rgba(0,0,0,.6), inset 0 -3px 6px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.5);
 }
 .fire i:nth-child(1){background:linear-gradient(180deg,#FF8A80,#C41208)}
 .fire i:nth-child(2){background:linear-gradient(180deg,#FFE27A,#C98A06)}
 .fire i:nth-child(3){background:linear-gradient(180deg,#8CF0B4,#0E8A48)}
 .cab.playing .lever,.cab.playing .sqbtns,.cab.playing .ball,.cab.playing .fire{display:none}

 .stick{position:relative;width:26px;height:40px;flex:none}
 .stick::before{ /* shaft */
  content:"";position:absolute;left:50%;bottom:7px;width:5px;height:26px;margin-left:-2.5px;
  background:linear-gradient(90deg,#4A4260,#8A82A8,#4A4260);border-radius:3px;
 }
 .stick::after{ /* ball top */
  content:"";position:absolute;left:50%;top:0;width:19px;height:19px;margin-left:-9.5px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff 0 8%, var(--neon-m) 40%, #8C0F4C 100%);
  box-shadow:0 0 14px -2px var(--neon-m);
 }
 .stick i{ /* dust washer */
  position:absolute;left:50%;bottom:3px;width:24px;height:7px;margin-left:-12px;border-radius:50%;
  background:#2A2340;box-shadow:inset 0 1px 0 rgba(255,255,255,.09);
 }
 .btns{display:flex;gap:10px}
 .btns i{
  width:20px;height:20px;border-radius:50%;display:block;
  box-shadow:0 2px 0 rgba(0,0,0,.55), inset 0 -3px 5px rgba(0,0,0,.4), 0 0 12px -3px currentColor;
 }
 .btns i:nth-child(1){background:radial-gradient(circle at 35% 30%,#fff 0 10%,var(--neon-y) 45%,#8A6A00 100%);color:var(--neon-y)}
 .btns i:nth-child(2){background:radial-gradient(circle at 35% 30%,#fff 0 10%,var(--neon-g) 45%,#0B6B34 100%);color:var(--neon-g)}
 .btns i:nth-child(3){background:radial-gradient(circle at 35% 30%,#fff 0 10%,var(--neon-c) 45%,#065C6B 100%);color:var(--neon-c)}
 .keys{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);text-align:right;line-height:1.7}
 /* shown only once a cabinet is playing: the escape hatches */
 .acts{display:none;gap:8px;flex-wrap:wrap;justify-content:center;flex:1}
 .cab.playing .acts{display:flex}
 .cab.playing .keys{display:none}
 /* the joystick and buttons are decoration; give their room to the controls */
 .cab.playing .stick,.cab.playing .btns{display:none}
 .acts a,.acts button{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);background:rgba(4,3,10,.55);border:1px solid var(--cab-edge);
  border-radius:3px;padding:6px 9px;cursor:pointer;text-decoration:none;line-height:1;
 }
 .acts a:hover,.acts button:hover,.acts a:focus-visible,.acts button:focus-visible{
  color:var(--hue);border-color:var(--hue);outline:0;
 }

 /* ── lower cabinet: the big printed art panel, coin door, kick plate ── */
 .body{
  position:relative;
  background:#0A0714;
  border-left:1px solid var(--cab-edge);border-right:1px solid var(--cab-edge);
  padding:0 0 0;
 }
 .art{
  position:relative; height:330px; overflow:hidden;
  background:#07050E;
 }
 .art img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 47%;
  display:block;
 }
 /* the room is dark, so the printed vinyl only catches a little light */
 .art::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
   linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.10) 22%, rgba(0,0,0,.06) 62%, rgba(0,0,0,.62) 100%),
   linear-gradient(90deg, rgba(0,0,0,.45) 0%, transparent 22%, transparent 74%, rgba(0,0,0,.5) 100%);
 }
 /* coin door, set into the art panel */
 .door{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;
  width:132px;padding:8px 10px 9px;border-radius:3px;
  background:linear-gradient(180deg,#5A5F6E 0%,#3A3F4C 18%,#23272F 60%,#171A21 100%);
  border:1px solid #6A707F;
  box-shadow:0 4px 10px -3px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:center;gap:10px;
 }
 .slot{
  width:5px;height:19px;border-radius:2px;
  background:linear-gradient(180deg,#05060A,#12151C);
  box-shadow:inset 0 0 4px #000, 0 1px 0 rgba(255,255,255,.22);
 }
 .door em{
  font-style:normal;font-size:7px;letter-spacing:.14em;text-transform:uppercase;
  color:#C9CEDA;text-shadow:0 1px 0 rgba(0,0,0,.8);
 }
 /* coin return cup */
 .door::after{
  content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  width:52px;height:9px;border-radius:0 0 4px 4px;
  background:linear-gradient(180deg,#20242C,#0D1015);border:1px solid #4E5462;border-top:0;
 }
 /* kick plate */
 .kick{
  height:26px;
  background:linear-gradient(180deg,#15111F,#08060F);
  border-top:1px solid rgba(255,255,255,.06);
  box-shadow:inset 0 8px 12px -8px #000;
 }
 /* the light pooling on the carpet under each cabinet */
 .cab::after{
  content:"";position:absolute;left:6%;right:6%;bottom:-26px;height:34px;z-index:-1;
  background:radial-gradient(60% 100% at 50% 0%, var(--hue), transparent 72%);
  opacity:.20;filter:blur(11px);
 }

 /* per-cabinet hue, trim, and art crop */
 .cab.kedr{--hue:#FF3B3B; --tmold:#D8DCE6}
 .cab.dprk{--hue:#FFD23F; --tmold:#2A2F3C}
 .cab.kedr .art img{object-position:50% 46%}
 .cab.dprk .art img{object-position:50% 62%}

 /* ───────────────────────── chrome ───────────────────────── */
 .rail{
  position:relative;z-index:3;max-width:1280px;margin:0 auto;
  padding:54px 22px 70px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
 }
 .rail a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent}
 .rail a:hover,.rail a:focus-visible{color:var(--neon-c);border-bottom-color:var(--neon-c);outline:0}

 /* speaker toggle */
 .spk{
  position:fixed;right:16px;bottom:16px;z-index:20;
  width:44px;height:44px;border-radius:50%;cursor:pointer;
  background:rgba(13,10,24,.9);border:1px solid var(--cab-edge);color:var(--dim);
  display:grid;place-content:center;transition:color .2s,border-color .2s,box-shadow .2s;
 }
 .spk:hover,.spk:focus-visible{color:var(--neon-c);border-color:var(--neon-c);box-shadow:0 0 18px -4px var(--neon-c);outline:0}
 .spk[data-on="1"]{color:var(--neon-g);border-color:var(--neon-g);box-shadow:0 0 18px -4px var(--neon-g)}
 .spk svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .spk .wave{opacity:0} .spk[data-on="1"] .wave{opacity:1}
 .spk .slash{opacity:1} .spk[data-on="1"] .slash{opacity:0}
</style>
</head>

<div class="room">

 <svg viewBox="0 0 24 24" aria-hidden="true">

  <path class="slash" d="M17 9.5l4.5 5m0-5l-4.5 5"/>
 </svg>

<!-- Room ambience: eight one-minute samples taken from across an hour of 80s
     arcade floor recording, mono AAC. Each visit starts at a random point and
     re-seeks periodically, so you never hear the same stretch twice. -->
<audio id="room" loop preload="auto" src="assets/room.m4a"></audio>

<!-- each game's own title-screen track, lifted from its repo -->
<audio id="snd-kedr" loop preload="none" src="assets/hover-kedr.m4a"></audio>
<audio id="snd-dprk" loop preload="none" src="assets/hover-dprk.m4a"></audio>

<script>
(function(){
 var room = document.getElementById('room'),
     spk  = document.getElementById('spk'),
     ROOM_VOL = 0.34,      // resting level of the arcade floor
     DUCK_VOL = 0.10,      // pulled down while a cabinet is under the cursor
     muted = false,
     started = false;

 // Start somewhere random in the reel so no two visits sound alike. Duration is
 // not known until metadata lands, so defer the seek if we are early.
 function reseek(){
  var d = room.duration;
  if(d && isFinite(d) && d > 25){
   try { room.currentTime = Math.random() * (d - 20); } catch(e){}
  } else {
   room.addEventListener('loadedmetadata', reseek, {once:true});
  }
 }

 function fadeTo(el, target, step){
  clearInterval(el._fade);
  el._fade = setInterval(function(){
   var v = el.volume, d = target - v;
   if(Math.abs(d) <= step){ el.volume = target; clearInterval(el._fade); return; }
   el.volume = Math.min(1, Math.max(0, v + (d > 0 ? step : -step)));
  }, 55);
 }

 var starting = false;
 function startRoom(){
  if(started || starting || muted) return;
  starting = true;
  reseek();
  room.volume = 0;
  room.play().then(function(){
   started = true; starting = false;
   reseek();                       // metadata is certainly in by now
   fadeTo(room, ROOM_VOL, 0.02);
  }).catch(function(){ starting = false; /* blocked until a gesture; retried below */ });
 }

 // Browsers will not play audio before the page has had a gesture, so try on
 // load and then again on the first real interaction.
 if(room.readyState >= 1) startRoom(); else room.addEventListener('loadedmetadata', startRoom, {once:true});
 ['pointerdown','keydown','pointermove','touchstart'].forEach(function(ev){
  addEventListener(ev, function once(){ startRoom(); if(started) removeEventListener(ev, once); }, {passive:true});
 });

 // Wander to a different part of the recording now and then.
 setInterval(function(){
  if(!started || muted || document.hidden) return;
  var back = room.volume;
  fadeTo(room, 0, 0.05);
  setTimeout(function(){ reseek(); fadeTo(room, back, 0.03); }, 700);
 }, 75000);

 document.addEventListener('visibilitychange', function(){
  if(document.hidden) room.pause();
  else if(started && !muted) room.play().catch(function(){});
 });

 // Speaker button is a mute switch; sound is on by default.
 spk.dataset.on = '1';
 spk.setAttribute('aria-pressed','true');
 spk.setAttribute('aria-label','Mute');
 spk.addEventListener('click', function(){
  muted = !muted;
  spk.dataset.on = muted ? '0' : '1';
  spk.setAttribute('aria-pressed', String(!muted));
  spk.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
  if(muted){
   room.pause();
   ['snd-kedr','snd-dprk'].forEach(function(id){
    var a = document.getElementById(id); if(a){ a.pause(); a.currentTime = 0; }
   });
  } else {
   started = false; starting = false; startRoom();
  }
 });

 // expose for the hover handlers below
 window.__arcade = {
  isMuted: function(){ return muted; },
  duck:    function(){ if(started) fadeTo(room, DUCK_VOL, 0.03); },
  unduck:  function(){ if(started) fadeTo(room, ROOM_VOL, 0.02); },
  fadeTo:  fadeTo
 };

 // Hover a machine: it steps forward, its own title track comes up, and the room
 // ducks underneath. Delegated from the hall and tracking a single "current"
 // cabinet, because per-element mouseenter/mouseleave can drop a leave event and
 // then the room stays ducked and two machines end up lit at once.
 var hall = document.getElementById('hall'), current = null;

 function sndFor(cab){
  return cab ? document.getElementById(cab.classList.contains('kedr') ? 'snd-kedr' : 'snd-dprk') : null;
 }

 function select(cab){
  if(cab === current) return;
  // stand the old one down
  if(current){
   current.classList.remove('lit');
   var prev = sndFor(current);
   if(prev){
    window.__arcade.fadeTo(prev, 0, 0.07);
    (function(a){ setTimeout(function(){ if(a.volume === 0){ a.pause(); a.currentTime = 0; } }, 700); })(prev);
   }
  }
  current = cab;
  if(!cab){ window.__arcade.unduck(); return; }
  cab.classList.add('lit');
  if(window.__arcade.isMuted()) return;
  window.__arcade.duck();
  var snd = sndFor(cab);
  if(!snd) return;
  snd.volume = 0;
  snd.play().then(function(){ window.__arcade.fadeTo(snd, 0.6, 0.05); }).catch(function(){});
 }

 if(hall){
  hall.addEventListener('pointerover', function(e){
   var cab = e.target.closest && e.target.closest('.cab');
   if(cab) select(cab);
  });
  hall.addEventListener('pointerleave', function(){ select(null); });
 }
 // focus works the same way for keyboard users
 document.querySelectorAll('.cab').forEach(function(cab){
  cab.addEventListener('focusin', function(){ select(cab); });
 });
 document.addEventListener('focusout', function(e){
  if(current && !current.contains(e.relatedTarget)) select(null);
 });

 // Attract reel: hold each frame, cross-fade to the next, loop. Pauses while a
 // game is actually running, and honours prefers-reduced-motion by standing still.
 var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
 document.querySelectorAll('.reel').forEach(function(reel){
  var frames = [].slice.call(reel.querySelectorAll('img'));
  if(still || frames.length < 2) return;
  var holds = (reel.dataset.hold||'').split(',').map(Number);
  var i = 0, timer;
  function step(){
   var cab = reel.closest('.cab');
   if(cab && cab.classList.contains('playing')) return;      // stop once a coin is in
   frames[i].classList.remove('on');
   i = (i + 1) % frames.length;
   frames[i].classList.add('on');
   timer = setTimeout(step, holds[i] || 3000);
  }
  timer = setTimeout(step, holds[0] || 3000);
  // don't burn frames while the tab is hidden
  document.addEventListener('visibilitychange', function(){
   if(document.hidden){ clearTimeout(timer); }
   else { clearTimeout(timer); timer = setTimeout(step, 900); }
  });
 });

 // Escape hatches: fullscreen, open in a real tab, stop and return to attract.
 document.querySelectorAll('.acts').forEach(function(acts){
  var cab=acts.closest('.cab'), screen=cab.querySelector('.screen');
  acts.addEventListener('click', function(e){
   var el=e.target.closest('[data-act]'); if(!el) return;
   var act=el.dataset.act, f=screen.querySelector('iframe');
   if(act==='full'){
    e.preventDefault();
    var target=screen;
    if(target.requestFullscreen) target.requestFullscreen().catch(function(){});
    else if(target.webkitRequestFullscreen) target.webkitRequestFullscreen();
    setTimeout(function(){ fit(screen); if(f) f.focus(); }, 260);
   }
   if(act==='stop'){
    e.preventDefault();
    if(f) f.remove();
    cab.classList.remove('playing');
   }
   // data-act="tab" is a plain link; let it through
  });
 });
 document.addEventListener('fullscreenchange', function(){
  document.querySelectorAll('.cab.playing .screen').forEach(fit);
 });

 // Scale the oversized iframe so the whole game fits the cabinet glass.
 var VW=960, VH=720;                       // logical viewport handed to the game
 function fit(screen){
  var f=screen.querySelector('iframe');
  if(!f) return;
  var r=screen.getBoundingClientRect();
  if(!r.width) return;
  var s=Math.min(r.width/VW, r.height/VH);
  screen.style.setProperty('--vw', VW+'px');
  screen.style.setProperty('--vh', VH+'px');
  screen.style.setProperty('--fit', s);
  // centre the scaled frame inside the glass
  f.style.left = Math.round((r.width  - VW*s)/2) + 'px';
  f.style.top  = Math.round((r.height - VH*s)/2) + 'px';
 }
 var t;
 addEventListener('resize', function(){
  clearTimeout(t);
  t=setTimeout(function(){ document.querySelectorAll('.cab.playing .screen').forEach(fit); }, 120);
 });
})();
</script>
</body></html>
